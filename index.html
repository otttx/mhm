<script id="app-data" type="application/json">{"course":{"name":"مهارات المهن القانونية (483 نظم)","section":"الشعبة (2578)","term":"الفصل الدراسي الأول 1448هـ"},"caseDate":"1448/6/10هـ","platform":["يُحفظ عملك تلقائياً على جهازك أثناء الكتابة، وتُرفع نسخة منه إلى المنصة كل دقيقة على الأكثر، ولك أن تحفظ متى شئت بزر «حفظ».","لك أن تخرج ثم تعود لإكمال الواجب، ولو من جهاز آخر، ما دمت لم تسلّمه تسليماً نهائياً.","التسليم النهائي مرة واحدة، ولا يمكنك التعديل بعده.","تسجّل المنصة عمليات اللصق في الخانات، والمدة التقريبية للكتابة، ويطّلع عليها الأستاذ."],"pasteBlocked":"اللصق في الخانات غير مسموح في هذا الواجب؛ فاكتب إجابتك بنفسك.","A":{"com":{"key":"com","order":"الواجب الأول","title":"التعليق على حكم قضائي مفترض","work":"التعليق","unit":"الحكم المفترض","docTab":"نص الحكم","req":15,"total":[900,1800],"intro":"خُصص لك حكم قضائي مفترض يختلف عن أحكام زملائك. والمطلوب أن تعلّق عليه تعليقاً منهجياً كما درسنا في الفصل الثامن من الكتاب.","before":["الأحكام من إعداد أستاذ المقرر لأغراض التدريب، والأسماء والأرقام والتواريخ فيها افتراضية.","اعتمد الوقائع والنصوص كما وردت في الحكم. واللوائح والعقود والبنود المقتبسة فيه جزء من الافتراض، أما ما ورد فيه من أنظمة سعودية نافذة فارجع إلى نصوصها الرسمية في موقع هيئة الخبراء بمجلس الوزراء.","المرجع: الكتاب المقرر، الفصل الثامن «مهارات التعليق على الأحكام القضائية» (ص255–270)، والفصل السابع «تحليل القواعد القانونية وتفسيرها» (ص215–252) عند مناقشة تفسير المحكمة للنصوص."],"rules":["اكتب تعليقك في الخانات السبع، وكل خانة محور من محاور التعليق في الكتاب (ص266–270) بالترتيب.","الطول الإجمالي نحو 900 إلى 1800 كلمة، ويظهر عدد الكلمات تحت كل خانة.","التزم منطلقات التعليق (ص256): الوضوح، والصحة، والدقة، والارتباط بالموضوع، والتعمق، والشمول.","التزم الموضوعية: ناقش الأسباب والنتيجة، ولا تتعرض لشخص القاضي (ص258، ص269–270).","وثّق كل نص أو قاعدة تستند إليها: اسم النظام ورقم المادة، أو صفحة الكتاب."],"ai":["يُمنع استعمال أدوات الذكاء الاصطناعي بأنواعها في كتابة التعليق، أو تحليل الحكم، أو صياغة العبارات؛ فالمقصود أن تكتسب أنت مهارة التعليق على الأحكام القضائية، وهي من نواتج التعلم في توصيف المقرر.","سيناقش الأستاذ كل طالب في تعليقه مناقشة شفهية، ويسأله عن مواضع منها، فيتبين في المناقشة من فهم ما كتب ممن لم يفهمه.","تُقدَّر الدرجة على المكتوب والمناقشة معاً، ومن عجز عن شرح ما كتبه لم يُحتسب له.","التعليق جهد فردي، وتشابه عملين في العبارات أو البناء يُعامل معاملة النقل."],"rubric":[["التقديم وبيان أهمية الحكم",10],["تلخيص الوقائع ومراحل النزاع",10],["تحديد الطلبات والدفوع ورد المحكمة عليها",15],["تحليل الأسباب: التفسير والتطبيق وفحص الأسباب",25],["تقويم المنطوق بحجة قانونية",15],["المخطط والصياغة والتوثيق",5],["المناقشة الشفهية",20]],"clo":"يقيس هذا الواجب من نواتج التعلم في توصيف المقرر: (1.2) تحديد مفهوم التكييف القانوني والاستدلال القضائي، و(1.3) معرفة أسس التعليق على الأحكام القضائية، و(2.3) تطبيق المهارات القانونية على مختلف جوانب العمل القانوني، و(3.2) تحمل المسؤولية في العمل الذاتي.","fields":[{"id":"f1","label":"التقديم وأهمية الحكم","range":[80,200],"hint":"عرّف بالحكم: طبيعة القضية، والمحكمة ودرجتها، ورقم القضية وتاريخ الحكم، والخصوم. ثم بيّن أهمية الحكم وسبب استحقاقه التعليق: ما المسألة الجديدة التي فصل فيها، أو المبدأ الذي أرساه؟"},{"id":"f2","label":"تلخيص الوقائع ومراحل النزاع","range":[120,300],"hint":"بعبارات موجزة من صياغتك، في نقاط متتالية (أولاً، ثانياً…) بحسب تسلسلها الزمني. وإن مر النزاع بأكثر من درجة فاذكر كل مرحلة ونتيجتها. لا تنسخ الوقائع كما وردت."},{"id":"f3","label":"الطلبات والدفوع ورد المحكمة","range":[120,300],"hint":"حدد طلبات المدعي، ودفوع المدعى عليه، ونوع كل دفع (شكلي، أو بعدم القبول، أو موضوعي)، وما أثارته المحكمة من تلقاء نفسها، ورد المحكمة على كل دفع."},{"id":"f4","label":"المسألة القانونية","range":[20,80],"hint":"صغ في سؤال أو سؤالين المشكلة القانونية التي فصل فيها الحكم."},{"id":"f5","label":"تحليل الأسباب","range":[300,700],"hint":"حدد النصوص والقواعد التي استند إليها الحكم، وكيف فسرها (بأي وسيلة من وسائل التفسير أو مذهب من مذاهبه)، وكيف طبقها على الوقائع. ثم افحص الأسباب: هل هي متكاملة أجابت عن كل دفع وطلب؟ ومتناغمة لا يناقض بعضها بعضاً؟ ومتسلسلة؟ ومؤدية إلى النتيجة باستخلاص سائغ؟ وإن كان في الحكم رأي مخالف فوازن بينه وبين رأي الأغلبية."},{"id":"f6","label":"المنطوق وتقويمه","range":[150,400],"hint":"انقل المنطوق بنصه، وحدد نوعه: هل فصل في الموضوع، أم وقف عند الاختصاص أو القبول؟ ثم قوّمه: هل تؤيده أم تعارضه، كلياً أو جزئياً؟ ولماذا؟ مستنداً إلى نص أو قاعدة، لا إلى رأي مجرد. وإن عارضته فبيّن ما كان ينبغي أن يُحكم به."},{"id":"f7","label":"مخطط التعليق","range":[30,150],"hint":"قسّم تعليقك إلى مباحث ومطالب بحسب المسائل التي يثيرها الحكم، على أن يكون تقويم المنطوق مبحثاً أو مطلباً مستقلاً (ص269–270). اكتب العناوين وترتيبها."}]},"con":{"key":"con","order":"الواجب الثاني","title":"الاستشارة القانونية","work":"الاستشارة","unit":"طلب الاستشارة","docTab":"الوقائع","req":15,"total":[700,1500],"intro":"عُرضت عليك وقائع تختلف عن وقائع زملائك، ومعها أسئلة من صاحب الشأن. والمطلوب أن تعدّ له استشارة قانونية مكتوبة بمراحلها التي درسناها في الفصل الخامس من الكتاب.","before":["الوقائع من إعداد أستاذ المقرر لأغراض التدريب، والأسماء فيها مستعارة.","أنت مستشار قانوني، عرض عليك صاحب الشأن الوقائع والمستندات المذكورة في 1448/6/10هـ، وطلب رأيك في الأسئلة الواردة في آخرها؛ فاحسب المدد والمواعيد من هذا التاريخ.","اعتمد الوقائع كما وردت، ولا تُضف إليها وقائع من عندك إلا على سبيل الفرض الصريح: «إذا ثبت أن…».","طبّق الأنظمة السعودية النافذة، وارجع إلى نصوصها الرسمية في موقع هيئة الخبراء بمجلس الوزراء، وتأكد من آخر تعديلاتها؛ فبعض الأنظمة عُدّل أو صدر حديثاً.","المرجع: الكتاب المقرر، الفصل الخامس، مبحث «الاستشارات القانونية» (ص154–160)."],"rules":["اكتب استشارتك في الخانات الأربع، وكل خانة مرحلة من مراحل إعداد الاستشارة في الكتاب (ص157–160) بالترتيب.","الطول الإجمالي نحو 700 إلى 1500 كلمة، ويظهر عدد الكلمات تحت كل خانة.","أجب عن كل سؤال من أسئلة صاحب الاستشارة؛ فالسؤال المتروك ينقص الدرجة.","الاستشارة بيان لحكم القانون في الوقائع، لا لرأيك الشخصي؛ فالتزم فيها الموضوعية والتخصص القانوني (ص155–156).","وثّق كل نص تستند إليه: اسم النظام ورقم المادة، أو صفحة الكتاب."],"ai":["يُمنع استعمال أدوات الذكاء الاصطناعي بأنواعها في كتابة الاستشارة، أو تحليل الوقائع، أو صياغة العبارات؛ فالمقصود أن تكتسب أنت مهارة إعداد الاستشارة القانونية، وهي من نواتج التعلم في توصيف المقرر.","سيناقش الأستاذ كل طالب في استشارته مناقشة شفهية، ويسأله عن مواضع منها، فيتبين في المناقشة من فهم ما كتب ممن لم يفهمه.","تُقدَّر الدرجة على المكتوب والمناقشة معاً، ومن عجز عن شرح ما كتبه لم يُحتسب له.","الاستشارة جهد فردي، وتشابه عملين في العبارات أو البناء يُعامل معاملة النقل."],"rubric":[["تحليل الوقائع وتحديد نوع الاستشارة",15],["تحديد القواعد القانونية وتوثيقها",20],["تطبيق القواعد على الوقائع والفرضيات",25],["الرأي الاستشاري والتوصيات",20],["المناقشة الشفهية",20]],"clo":"يقيس هذا الواجب من نواتج التعلم في توصيف المقرر: (1.2) تحديد مفهوم التكييف القانوني والاستدلال القضائي، و(2.1) التمييز بين الاستشارة الشفهية والمكتوبة، و(2.3) تطبيق المهارات القانونية على مختلف جوانب العمل القانوني، و(3.2) تحمل المسؤولية في العمل الذاتي.","fields":[{"id":"f1","label":"تحليل الوقائع وتحديد نوع الاستشارة","range":[150,350],"hint":"رتّب الوقائع زمنياً بتواريخها في نقاط، واربط بعضها ببعض. وحدد المستندات المتاحة وقيمتها، والمعلومات الناقصة التي تسأل عنها صاحب الاستشارة وأثرها في رأيك (ص157–158). ثم حدد نوع الاستشارة: موضوعها، ووقتها (سابقة أو لاحقة)، وطبيعتها (وقائية أو علاجية)، مع التعليل (ص156–157). واختم بصياغة المسألة القانونية في سؤال أو أكثر."},{"id":"f2","label":"القواعد القانونية الحاكمة","range":[150,400],"hint":"اذكر الأنظمة واللوائح التي تحكم الوقائع: اسم النظام، ورقم المادة، ونصها أو مضمونها الدقيق. ورتبها حسب تدرجها، ونبّه إلى أي تعارض بينها. ثم اذكر ما وجدته من اجتهاد قضائي أو رأي فقهي في المسألة، مع توثيق مصدره (ص158–159)."},{"id":"f3","label":"تطبيق القواعد على الوقائع","range":[200,500],"hint":"فسّر القاعدة إن كانت غامضة، وبيّن وسيلة التفسير. ثم طبقها على الوقائع واقعةً واقعة: هل تنطبق تماماً أم جزئياً؟ وإن نقصت الوقائع أو احتملت أكثر من وجه فاستعمل الفرضيات: «إذا ثبت كذا… فالحكم كذا، وإن لم يثبت… فالحكم كذا» (ص159). وناقش الحجة المتوقعة من الطرف الآخر وبيّن الرد عليها."},{"id":"f4","label":"الرأي الاستشاري والتوصيات","range":[120,350],"hint":"أجب عن كل سؤال من أسئلة صاحب الاستشارة جواباً مباشراً. إن كان الحل بسيطاً فاكتبه موجزاً واضحاً، وإن تعددت الفروض فاعرض الآراء من الأضعف إلى الأقوى (ص160). ثم حدد الخطوات العملية التي توصي بها بترتيبها، والجهة المختصة، والمواعيد الواجب مراعاتها."}]}},"rulings":[{"t":"تصوير فناء استراحة بطائرة مسيّرة","court":"المحكمة الجزائية بمحافظة (…) — الدائرة الجزائية الثانية","meta":["رقم القضية: (2381) لعام 1447هـ — تاريخ الحكم: 1447/11/04هـ","المدعي العام: النيابة العامة — المدعي بالحق الخاص: خالد (…) — المدعى عليه: فيصل (…)","موضوع الدعوى: اتهام بالمساس بالحياة الخاصة بالتصوير بطائرة مسيّرة"],"facts":["تتلخص الوقائع في أن المدعى عليه أطلق مساء 1447/8/14هـ طائرة مسيّرة (درون) مزودة بكاميرا من مزرعته المجاورة لاستراحة المدعي بالحق الخاص، فحلّقت فوق فناء الاستراحة نحو أربع دقائق، وكانت أسرة المدعي بالحق الخاص مجتمعة فيه. فصوّر ابنُ المدعي بالحق الخاص الطائرةَ بجواله وأبلغ الشرطة، فضُبطت الطائرة، وأثبت التقرير الفني أن ذاكرتها تحوي مقطعاً للفناء ومن فيه مدته أربع دقائق، ولم يثبت نشره.","وادعت النيابة العامة على المدعى عليه بارتكاب الجريمة المنصوص عليها في الفقرة (4) من المادة (الثالثة) من نظام مكافحة الجرائم المعلوماتية، وطلبت عقوبته ومصادرة الطائرة. ودفع وكيل المدعى عليه بثلاثة دفوع: أولها أن النص يعاقب على إساءة استخدام «الهواتف النقالة المزودة بالكاميرا»، والطائرة ليست هاتفاً، ولا يجوز القياس في التجريم؛ لأن المادة (38) من النظام الأساسي للحكم تنص على أنه «لا جريمة ولا عقوبة إلا بناءً على نص شرعي، أو نص نظامي». وثانيها أن موكله كان يصور مزرعته، فمرّت الطائرة فوق الفناء عرضاً دون قصد. وثالثها أن المقطع لم يُنشر، فلا مساس بالحياة الخاصة."],"reasons":["وحيث إن الفقرة (4) من المادة (الثالثة) من نظام مكافحة الجرائم المعلوماتية تعاقب على «المساس بالحياة الخاصة عن طريق إساءة استخدام الهواتف النقالة المزودة بالكاميرا، أو ما في حكمها».","وحيث إن عبارة «أو ما في حكمها» تدل على أن المنظم لم يقصر التجريم على الهاتف النقال، بل مدّه إلى كل جهاز محمول يصوّر، والطائرة المسيّرة جهاز محمول مزود بكاميرا.","وحيث إن حكمة النص حماية خصوصية الناس، والطائرة المسيّرة أشد إخلالاً بها من الهاتف؛ لأنها تبلغ ما وراء الأسوار، فهي أولى بالمنع.","وحيث إن المساس بالحياة الخاصة يتحقق بالتصوير ذاته ولو لم يُنشر المقطع؛ إذ لم يشترط النص النشر.","وحيث ثبت التصوير بالتقرير الفني وبإقرار المدعى عليه بتشغيل الطائرة، وقرر المدعي بالحق الخاص احتفاظه بحقه في المطالبة بالتعويض."],"ruling":"فلهذه الأسباب حكمت الدائرة: أولاً: إدانة المدعى عليه بما نُسب إليه، وتغريمه خمسة عشر ألف ريال. ثانياً: مصادرة الطائرة المضبوطة، وإتلاف المقطع المصوّر. ثالثاً: إثبات احتفاظ المدعي بالحق الخاص بحقه في المطالبة بالتعويض."},{"t":"تشهير في مجموعة «واتساب» لسكان حي","court":"محكمة الاستئناف بمنطقة (…) — الدائرة الجزائية الأولى","meta":["رقم القضية الاستئنافية: (917) لعام 1447هـ — تاريخ الحكم: 1447/12/02هـ","المستأنف: عبدالله (…) — المستأنف ضدهما: النيابة العامة، وسعد (…) المدعي بالحق الخاص","موضوع الاستئناف: الاعتراض على حكم الإدانة بالتشهير عبر مجموعة «واتساب»"],"facts":["تتلخص الوقائع في أن المستأنف نشر في 1447/5/10هـ ثلاثة مقاطع صوتية في مجموعة «واتساب» تضم (38) عضواً من سكان الحي، اتهم فيها المستأنف ضده الثاني، وهو المشرف على جمع تبرعات صيانة مسجد الحي، بأنه «يأكل أموال التبرعات». فادعت النيابة العامة عليه بجريمة التشهير المنصوص عليها في الفقرة (5) من المادة (الثالثة) من نظام مكافحة الجرائم المعلوماتية، وطلب المدعي بالحق الخاص تعويضاً قدره ثلاثون ألف ريال.","وحكمت المحكمة الجزائية بإدانة المستأنف، وتغريمه عشرة آلاف ريال، وإلزامه بدفع خمسة آلاف ريال للمدعي بالحق الخاص تعويضاً. فاستأنف المحكوم عليه، وقال: إن المجموعة مغلقة لا يدخلها إلا أهل الحي، فلا تشهير؛ وإن النص يشترط «التشهير» و«إلحاق الضرر» معاً، ولم يثبت أي ضرر؛ وإنه قال ما يعتقد صحته، وقدّم صورة من كشف حساب التبرعات قال إنها تبين اختلاف المبالغ."],"reasons":["وحيث إن الفقرة (5) من المادة (الثالثة) من نظام مكافحة الجرائم المعلوماتية تعاقب على «التشهير بالآخرين، وإلحاق الضرر بهم، عبر وسائل تقنيات المعلومات المختلفة».","وحيث إن التشهير في اللغة الإذاعة والإشاعة بين الناس، فلا يتحقق إلا بالنشر على العموم، والمجموعة محل الدعوى مغلقة محصورة الأعضاء، يعرف بعضهم بعضاً.","وحيث إن الواو في قوله: «وإلحاق الضرر بهم» للجمع، فلا تقوم الجريمة إلا باجتماع التشهير والضرر، ولم يقدم المدعي بالحق الخاص ما يثبت ضرراً لحقه.","وحيث إن الحق الخاص تابع للحق العام، والتابع تابع، فإذا انتفت الجريمة انتفى التعويض."],"ruling":"فلهذه الأسباب حكمت الدائرة: نقض الحكم المستأنف، والحكم بعدم إدانة المستأنف بما نُسب إليه، ورد دعوى الحق الخاص."},{"t":"غرامة عربة طعام خارج موقعها المرخص","court":"المحكمة الإدارية بمنطقة (…) — الدائرة الإدارية الثانية","meta":["رقم القضية: (1460) لعام 1447هـ — تاريخ الحكم: 1447/10/18هـ","المدعي: عبدالرحمن (…)، صاحب عربة طعام متنقلة — المدعى عليها: بلدية محافظة (…)","موضوع الدعوى: طلب إلغاء قرار مخالفة وغرامة"],"facts":["تتلخص الوقائع في أن المدعي يحمل ترخيصاً لعربة طعام متنقلة، حُدد فيه موقع مزاولة النشاط بـ«ساحة الفعاليات الشمالية». وفي 1447/6/3هـ نقل عربته إلى مواقف حديقة عامة تبعد عن الموقع المرخص نحو خمسمئة متر، فحرر مراقب البلدية مخالفة «مزاولة نشاط دون ترخيص»، وفرض عليه غرامة قدرها خمسة آلاف ريال استناداً إلى المادة (9) من اللائحة المحلية لتنظيم العربات المتنقلة.","فسدد المدعي الغرامة ليتمكن من تجديد ترخيصه، ثم تظلم إلى البلدية خلال المدة النظامية فرُفض تظلمه، فأقام دعواه طالباً إلغاء القرار، واحتج بأن مخالفته هي المنصوص عليها في المادة (11) من اللائحة، وغرامتها ألف ريال. ودفع ممثل البلدية بعدم قبول الدعوى؛ لأن المدعي سدد الغرامة فيكون قد رضي بالقرار، والساقط لا يعود. وأجاب في الموضوع بأن الترخيص مرتبط بالموقع، فمن زاول النشاط في غيره فقد زاوله دون ترخيص.","ونص المادتين كما وردتا في اللائحة:",">المادة (9): «يُعاقب من يزاول نشاط العربات المتنقلة دون ترخيص بغرامة قدرها (5,000) ريال».",">المادة (11): «يُعاقب صاحب العربة المرخصة إذا زاول النشاط في غير الموقع المحدد في الترخيص بغرامة قدرها (1,000) ريال، وتُضاعف عند التكرار»."],"reasons":["وحيث إن سداد المدعي للغرامة كان شرطاً لتجديد ترخيصه، فلا يُعد رضاً منه بالقرار ولا تنازلاً عن حقه في الطعن عليه، مما تنتهي معه الدائرة إلى رد الدفع بعدم القبول.","وحيث إن الترخيص إذن مقيد بموقعه، فمن زاول النشاط خارج الموقع فقد زاول نشاطاً لم يشمله الإذن، فيكون في حكم من زاوله دون ترخيص.","وحيث إن العبرة بالمقاصد والمعاني لا بالألفاظ والمباني، ومقصود اللائحة ضبط أماكن العربات المتنقلة.","وحيث إن القرار صدر من مختص وفق ما تقضي به اللائحة؛ فإن الدعوى تكون حرية بالرفض."],"ruling":"فلهذه الأسباب حكمت الدائرة: رفض الدعوى."},{"t":"إغلاق مقهى بناءً على بلاغات السكان","court":"المحكمة الإدارية بمنطقة (…) — الدائرة الإدارية الأولى","meta":["رقم القضية: (2207) لعام 1447هـ — تاريخ الحكم: 1447/12/09هـ","المدعية: مؤسسة (ر) لتقديم المشروبات (مقهى) — المدعى عليها: بلدية محافظة (…)","موضوع الدعوى: طلب إلغاء قرار إغلاق مؤقت"],"facts":["تتلخص الوقائع في أن البلدية أصدرت في 1447/9/20هـ قراراً بإغلاق مقهى المدعية ثلاثين يوماً «لإزعاج السكان وتكرار الشكاوى»، بعد ورود أربعة بلاغات من سكان الحي عبر منصة البلاغات، ونُفذ القرار في اليوم نفسه. فتظلمت المدعية خلال المدة النظامية، وطلبت تزويدها بالبلاغات ومحاضر الضبط فلم تُجب، فأقامت دعواها بعد انتهاء مدة الإغلاق طالبة إلغاء القرار، وقالت: إن المقهى يغلق في الحادية عشرة ليلاً، وإنه مجهز بعوازل للصوت، وإن البلدية لم تنذرها قبل الإغلاق، ولم تقس مستوى الصوت.","ودفع ممثل البلدية بعدم قبول الدعوى لانتفاء المصلحة؛ لأن مدة الإغلاق انتهت وعاد المقهى إلى العمل. وأجاب في الموضوع بأن البلاغات المتكررة كافية لإثبات الإزعاج، وقدم مذكرة داخلية بالإغلاق، ولم يقدم محضر معاينة.","وتنص المادة (14) من اللائحة المحلية للمحلات العامة على أنه:",">«يجوز إغلاق المحل مدة لا تزيد على ثلاثين يوماً إذا ثبت إخلاله بالراحة العامة للسكان، بعد إنذاره كتابياً»."],"reasons":["وحيث إن انتهاء مدة الإغلاق لا يُذهب مصلحة المدعية؛ لأن القرار يبقى مقيداً في سجلها، ويُحتسب سابقة عند تكرار المخالفة، ويمس سمعتها التجارية، فيتعين رد الدفع بعدم القبول.","وحيث إن القرار الإداري يحمل قرينة السلامة، إذ الأصل أن كل قرار إداري صدر صحيحاً وفي حدود المصلحة العامة ما لم يقم دليل قاطع على خلاف ذلك.","وحيث إن تعدد البلاغات قرينة كافية على إخلال المقهى بالراحة العامة، ولم تقدم المدعية دليلاً قاطعاً ينقض هذه القرينة.","وحيث إن للجهة الإدارية سلطة تقديرية في اختيار الوسيلة المناسبة لحماية راحة السكان؛ فإن الدعوى تكون في غير محلها."],"ruling":"فلهذه الأسباب حكمت الدائرة: رفض الدعوى."},{"t":"استبعاد أقل العروض لنقص الضمان الابتدائي","court":"المحكمة الإدارية بمنطقة (…) — الدائرة الإدارية الرابعة","meta":["رقم القضية: (1873) لعام 1447هـ — تاريخ الحكم: 1447/12/21هـ","المدعية: شركة (م) للمقاولات — المدعى عليها: بلدية محافظة (…)","موضوع الدعوى: طلب إلغاء قرار استبعاد عرض في منافسة عامة"],"facts":["تتلخص الوقائع في أن البلدية طرحت منافسة عامة لصيانة الحدائق العامة، ونص البند (8) من كراسة الشروط على أنه:",">«يُقدَّم مع العرض ضمان بنكي ابتدائي بنسبة (2%) من قيمة العرض، ويُستبعد العرض غير المصحوب بالضمان المطلوب».","وقدمت المدعية عرضاً دوّنت في نموذجه خانتين: «قيمة العرض قبل الضريبة: 2,000,000 ريال»، و«إجمالي قيمة العرض شاملاً الضريبة: 2,300,000 ريال»، وأرفقت ضماناً قدره أربعون ألف ريال. فاستبعدت لجنة فحص العروض عرضها؛ لأن الضمان المطلوب ستة وأربعون ألف ريال محسوبة على الإجمالي، مع أن عرضها أقل العروض بفارق مئة وعشرين ألف ريال.","فتظلمت فرُفض تظلمها، ووقّعت البلدية العقد مع صاحب العرض الثاني في 1447/10/1هـ، فأقامت دعواها طالبة إلغاء قرار الاستبعاد. ودفع ممثل البلدية بعدم قبول الدعوى لانتفاء المصلحة بعد توقيع العقد، وأجاب في الموضوع بأن الشرط واضح وملزم لجميع المتنافسين."],"reasons":["وحيث إن مصلحة المدعية قائمة ولو وُقّع العقد؛ لأن إلغاء القرار يفتح لها باب المطالبة بالتعويض، فيتعين رد الدفع بعدم القبول.","وحيث إن الحكمة من الضمان الابتدائي التحقق من جدية العارض، وهذه الحكمة متحققة بضمان قدره أربعون ألف ريال، والفرق ستة آلاف ريال يسير لا يُخل بالغرض.","وحيث إن العبرة بالمقاصد والمعاني، وفي استبعاد أقل العروض إهدار للمال العام بمئة وعشرين ألف ريال؛ فإن قرار الاستبعاد يكون مخالفاً للغاية من الشرط، متعيناً إلغاؤه."],"dissent":"يرى أحد أعضاء الدائرة رفض الدعوى؛ لأن الشرط واضح ومعلن لجميع المتنافسين، والتزم به غير المدعية، والتسامح فيه لعارض واحد يخل بالمساواة بينهم. ولا يجوز ترك نص واضح بحجة حكمته؛ فالحكمة يُستعان بها عند غموض النص، لا لتعطيله.","ruling":"فلهذه الأسباب حكمت الدائرة بالأغلبية: إلغاء قرار استبعاد عرض المدعية."},{"t":"رفض رخصة بناء استناداً إلى مسودة مخطط","court":"المحكمة الإدارية بمنطقة (…) — الدائرة الإدارية الخامسة","meta":["رقم القضية: (3115) لعام 1447هـ — تاريخ الحكم: 1448/01/16هـ","المدعي: ناصر (…) — المدعى عليها: بلدية محافظة (…)","موضوع الدعوى: طلب إلغاء قرار رفض رخصة بناء، والتعويض"],"facts":["تتلخص الوقائع في أن المدعي تقدم في 1447/2/5هـ بطلب رخصة لبناء محلات تجارية على أرضه الواقعة على طريق رئيس، فرفضت البلدية طلبه في 1447/4/10هـ «لأن الأرض يمر بها شارع مقترح بعرض عشرين متراً في مسودة المخطط المحلي المحدث»، والمسودة لم تُعتمد بعد من الجهة المختصة.","فتظلم المدعي فرُفض تظلمه، فأقام دعواه طالباً إلغاء قرار الرفض، وتعويضه بثمانين ألف ريال عن أجرة ثمانية أشهر فاتته، وقدّم خطاباً من شركة تعرض استئجار المحلات بعشرة آلاف ريال شهرياً متى اكتمل بناؤها. وأجاب ممثل البلدية بأن منح الرخصة الآن يزيد على الدولة تكلفة نزع ملكية جزء الأرض لاحقاً، وبأن المخطط في مراحله الأخيرة، والمصلحة العامة مقدمة على المصلحة الخاصة."],"reasons":["وحيث إن مسودة المخطط لا تعدو أن تكون عملاً تحضيرياً لم يكتسب صفة الإلزام، فلا يصح أن يُبنى عليها قرار يحرم المالك من حقه في الانتفاع بملكه في حدود الأنظمة النافذة.","وحيث إن البلدية لم تستند إلى مخطط معتمد أو نص نظامي يمنع البناء، فيكون قرارها قد افتقد سنده، متعيناً إلغاؤه.","وحيث إن المدعي لم يقدم ما يثبت الضرر الذي يدعيه، والضرر المحتمل لا يُعوَّض عنه، فيتعين رفض طلب التعويض."],"ruling":"فلهذه الأسباب حكمت الدائرة: أولاً: إلغاء قرار البلدية برفض منح المدعي رخصة البناء. ثانياً: رفض طلب التعويض."},{"t":"لوحة على سطح محل وفيها شعار راعٍ","court":"المحكمة الإدارية بمنطقة (…) — الدائرة الإدارية الثانية","meta":["رقم القضية: (2642) لعام 1447هـ — تاريخ الحكم: 1447/11/27هـ","المدعية: مؤسسة (ع) للعطور — المدعى عليها: بلدية محافظة (…)","موضوع الدعوى: طلب إلغاء قرار إزالة لوحة، والغرامة، وتكاليف الإزالة"],"facts":["تتلخص الوقائع في أن المدعية ركّبت أعلى سطح مبناها المكوّن من دورين لوحة مضيئة طولها اثنا عشر متراً وعرضها ثلاثة أمتار، تحمل اسمها التجاري ونشاطها، وفي أسفلها شعار شركة اتصالات مع عبارة «برعاية»؛ إذ تحملت شركة الاتصالات ثلاثين في المئة من تكلفة اللوحة بموجب اتفاق تسويقي. فأنذرتها البلدية بإزالة اللوحة خلال ثلاثة أيام بوصفها «لوحة إعلانية دون ترخيص»، فلما لم تُزلها أزالتها البلدية، وألزمتها بتكاليف الإزالة وقدرها ثمانية عشر ألف ريال، وبغرامة قدرها خمسة آلاف ريال.","فتظلمت المدعية فرُفض تظلمها، فأقامت دعواها، وقالت: إن اللوحة تعريفية، وحافة السطح جزء من الواجهة، والشعار صغير لا يتجاوز عُشر مساحتها. وأجاب ممثل البلدية بأن الاستثناء خاص باللوحة المثبتة على الواجهة، والسطح ليس واجهة، ووضع شعار جهة أخرى يجعل اللوحة إعلاناً.","وتنص المادة (6) من اللائحة المحلية للوحات على أنه:",">«تُستثنى من الحصول على ترخيص الإعلان اللوحةُ التعريفية التي تحمل اسم المنشأة ونشاطها، المثبتة على واجهتها»."],"reasons":["وحيث إن الاستثناء لا يُتوسع فيه ولا يُقاس عليه، وقد قيّد النص اللوحة المستثناة بأن تكون مثبتة على الواجهة، والسطح ليس واجهة في عرف الناس.","وحيث إن إضافة شعار جهة أخرى مقابل مشاركتها في التكلفة يُخرج اللوحة من وصف التعريف إلى وصف الإعلان؛ فإن قرار الإزالة والغرامة يكونان قائمين على سببهما.","وحيث إن مهلة ثلاثة أيام لا تكفي لإزالة لوحة بهذا الحجم، فلم تمكّن البلدية المدعية من إزالتها بنفسها، فلا تتحمل تكاليف الإزالة."],"ruling":"فلهذه الأسباب حكمت الدائرة: أولاً: رفض طلب إلغاء قرار الإزالة والغرامة. ثانياً: إلغاء قرار إلزام المدعية بتكاليف الإزالة."},{"t":"إنهاء بعثة لتغيير التخصص وإلزام بالرد","court":"المحكمة الإدارية بمنطقة (…) — الدائرة الإدارية الثالثة","meta":["رقم القضية: (1529) لعام 1447هـ — تاريخ الحكم: 1447/10/29هـ","المدعي: عبدالعزيز (…)، معيد مبتعث — المدعى عليها: جامعة (…)","موضوع الدعوى: طلب إلغاء قرار إنهاء بعثة، وقرار إلزام برد نفقاتها"],"facts":["تتلخص الوقائع في أن الجامعة ابتعثت المدعي عام 1445هـ لدراسة الماجستير في القانون التجاري، وفي 1446/9هـ غيّر تخصصه إلى «قانون التقنية» بموافقة مشرفه في الجامعة الأجنبية والملحقية الثقافية، دون موافقة مجلس القسم في الجامعة، وكان معدله التراكمي (3.8) من (4). فأصدرت الجامعة في 1447/2هـ قراراً بإنهاء بعثته، وقراراً بإلزامه برد ما صُرف عليه وقدره ثلاثمئة وخمسون ألف ريال.","فتظلم المدعي من قرار إنهاء البعثة وحده فرُفض تظلمه، فأقام دعواه طالباً إلغاء القرارين. ودفع ممثل الجامعة بعدم قبول طلب إلغاء قرار الرد؛ لأن المدعي لم يتظلم منه. وأجاب في الموضوع بأن «الجهة المختصة» هي الجامعة، وبأن القسم يحتاج إلى تخصص القانون التجاري.","ومما نصت عليه لائحة الابتعاث في الجامعة:",">المادة (15): «لا يجوز للمبتعث تغيير تخصصه إلا بموافقة الجهة المختصة».",">المادة (22): «يلتزم المبتعث الذي يترك الدراسة دون عذر مقبول بإعادة ما صُرف عليه خلال مدة البعثة»."],"reasons":["وحيث إن قرار الرد مترتب على قرار إنهاء البعثة، والتابع تابع، فالتظلم من الأصل يشمل الفرع، فيتعين رد الدفع بعدم القبول.","وحيث إن اللائحة صادرة من الجامعة وتخاطب مبتعثيها، فـ«الجهة المختصة» فيها هي الجامعة ممثلة في مجلس القسم، وموافقة الملحقية إجراء إداري لا يغني عن موافقة الجامعة، فيكون قرار إنهاء البعثة صحيحاً.","وحيث إن من أُنهيت بعثته لمخالفته في حكم من ترك الدراسة؛ لأن كليهما لم تتحقق به غاية البعثة، فيلتزم بالرد قياساً على ما نصت عليه المادة (22)."],"ruling":"فلهذه الأسباب حكمت الدائرة: رفض الدعوى."},{"t":"جزاء موظف على منشور ينتقد صالة المراجعين","court":"المحكمة الإدارية بمنطقة (…) — الدائرة الإدارية السادسة","meta":["رقم القضية: (2964) لعام 1447هـ — تاريخ الحكم: 1447/12/14هـ","المدعي: ماجد (…)، موظف — المدعى عليها: الإدارة العامة لـ(…) بالمنطقة","موضوع الدعوى: طلب إلغاء قرار جزاء تأديبي"],"facts":["تتلخص الوقائع في أن المدعي نشر في 1447/3/2هـ على حسابه الشخصي في منصة «إكس» صورة لصالة انتظار المراجعين في مقر عمله وهي مكتظة، يظهر فيها شعار جهته على الجدار، وكتب: «المراجع يستاهل أفضل من كذا». فشكّل مدير الإدارة لجنة تحقيق يرأسها مدير خدمة العملاء، وهو الرئيس المباشر للمدعي والمسؤول عن الصالة، فأوصت اللجنة بمعاقبته بالحسم من راتبه ثلاثة أيام لإساءته إلى جهة عمله، فاعتمد المدير التوصية.","فتظلم المدعي فرُفض تظلمه، فأقام دعواه طالباً إلغاء الجزاء، وقال: إن رئيس اللجنة هو المقصود بالانتقاد فلا يصح أن يحقق فيه، وإن المنشور في مصلحة المراجعين ولم يتضمن سراً، وإنه رفع الملاحظة نفسها داخلياً مرتين بالبريد الإلكتروني فلم يُستجب له، وأرفق الرسالتين. وأجاب ممثل الجهة بأن الجزاء في حدود السلطة التقديرية، وبأن المنشور أعيد نشره ألفي مرة فأساء إلى صورة الجهة."],"reasons":["وحيث إن الأصل حياد أعضاء لجان التحقيق، ولم يقدم المدعي ما يثبت تحيز رئيس اللجنة ضده، فلا وجه لما أثاره في هذا الشأن.","وحيث إن واجب الوظيفة يقتضي من الموظف التحفظ، ورفع ملاحظاته بالطرق النظامية الداخلية، لا بالنشر العلني الذي يسيء إلى صورة جهة عمله أمام الناس.","وحيث إن الجزاء الموقع من أخف الجزاءات، ومتناسب مع المخالفة؛ فإن الدعوى تكون في غير محلها."],"ruling":"فلهذه الأسباب حكمت الدائرة: رفض الدعوى."},{"t":"غرامة تأخير مقاول تأخر تسليم موقعه","court":"محكمة الاستئناف الإدارية بمنطقة (…) — الدائرة الثانية","meta":["رقم القضية الاستئنافية: (744) لعام 1447هـ — تاريخ الحكم: 1448/02/08هـ","المستأنفة: شركة (ن) للمقاولات — المستأنف ضدها: بلدية محافظة (…)","موضوع الاستئناف: الاعتراض على حكم رفض دعوى استرداد غرامة تأخير"],"facts":["تتلخص الوقائع في أن البلدية تعاقدت مع المستأنفة في 1445/7/1هـ على إنشاء حديقة عامة، ومما نص عليه العقد:",">البند (5): «مدة التنفيذ اثنا عشر شهراً تبدأ من تاريخ توقيع العقد».",">البند (18): «تُحتسب غرامة التأخير عن كل يوم تأخير، ما لم يكن التأخير لسبب لا يد للمقاول فيه».",">البند (19): «على المقاول أن يتقدم بطلب تمديد مسبب خلال خمسة عشر يوماً من حدوث سبب التأخير، وإلا سقط حقه في التمديد».","وتأخرت البلدية في تسليم الموقع ثلاثة أشهر لوجود خط كهرباء احتاج نقله، وأنهت المستأنفة المشروع بعد انتهاء المدة بأربعة أشهر، ولم تتقدم بطلب تمديد، فحسمت البلدية غرامة التأخير بحدها الأعلى وقدره أربعمئة ألف ريال. فأقامت المستأنفة دعواها أمام المحكمة الإدارية طالبة استرداد الغرامة، فحكمت برفضها؛ لأن المستأنفة لم تتقدم بطلب التمديد في موعده فسقط حقها. فاستأنفت الحكم."],"reasons":["وحيث إن الأصل أن مدة التنفيذ لا تبدأ إلا من تاريخ تسليم الموقع فعلاً، إذ لا يُتصور أن يُحاسَب المقاول على مدة لم يتمكن فيها من العمل، فيكون التأخير المنسوب إلى المستأنفة شهراً واحداً.","وحيث إن البلدية هي التي تسببت في تأخير التسليم وتعلم به، فلا معنى لإلزام المقاول بإعلامها بما تعلمه، ولا وجه للاحتجاج عليه بالبند (19).","وحيث إن الحكم المستأنف لم يراعِ ذلك؛ فإنه يتعين نقضه، وإلزام البلدية برد ما حسمته زائداً على غرامة شهر واحد، وقدره ثلاثمئة ألف ريال."],"ruling":"فلهذه الأسباب حكمت الدائرة: نقض الحكم المستأنف، والحكم بإلزام البلدية بأن ترد إلى المستأنفة ثلاثمئة ألف ريال."},{"t":"الدراجات الكهربائية (سكوتر) والدراجات النارية","court":"المحكمة الإدارية بمنطقة (…) — الدائرة الإدارية الأولى","meta":["رقم القضية: (3380) لعام 1447هـ — تاريخ الحكم: 1448/01/23هـ","المدعية: شركة (خ) لتأجير الدراجات الكهربائية — المدعى عليها: أمانة منطقة (…)","موضوع الدعوى: طلب إلغاء قرار غرامة ومصادرة"],"facts":["تتلخص الوقائع في أن المدعية تؤجر للجمهور، عبر تطبيق إلكتروني، أربعمئة دراجة كهربائية (سكوتر) سرعتها القصوى خمسة وعشرون كيلومتراً في الساعة، بموجب تصريح تجريبي من الأمانة صدر في 1446/11هـ، ونص على أن «تُستخدم الدراجات في المسارات المحددة في المخطط المرفق، وتُوقف في نقاط التجميع المعتمدة». وفي 1447/7/1هـ ضبط مراقبو الأمانة مئة وعشرين دراجة أوقفها مستخدموها على الأرصفة، فغرّمت الأمانة المدعية ستين ألف ريال، بواقع خمسمئة ريال عن كل دراجة، وصادرت الدراجات بحجة التكرار، استناداً إلى إنذار سابق وجهته إليها في 1447/5هـ.","فأقامت المدعية دعواها بعد رفض تظلمها، وقالت: إن الدراجة الكهربائية ليست «دراجة نارية»؛ فلا وقود فيها ولا لوحة ولا رخصة قيادة، وإن اللائحة صدرت عام 1438هـ قبل ظهور هذه الدراجات، وإن الذين أوقفوها على الأرصفة هم المستخدمون لا الشركة، وإن التصريح التجريبي هو الذي يحكم نشاطها.","وتنص المادة (21) من اللائحة المحلية لاستخدام الأرصفة على أنه:",">«يُمنع إيقاف الدراجات النارية على الأرصفة، ويُعاقب المخالف بغرامة قدرها (500) ريال عن كل دراجة، وتُصادر عند التكرار»."],"reasons":["وحيث إن ألفاظ اللائحة تُفهم في ضوء الواقع الذي تُطبق فيه اليوم، وغاية النص إبقاء الأرصفة خالية للمشاة، والدراجة الكهربائية تسير بمحرك فهي دراجة نارية بهذا المعنى، ولو عُرضت على واضع اللائحة اليوم لمنع إيقافها على الأرصفة؛ فإن الغرامة تكون قائمة على سببها.","وحيث إن الإنذار السابق لا يُعد مخالفة ثابتة، فلا يتحقق به التكرار، فتكون المصادرة على غير سند."],"dissent":"يرى أحد أعضاء الدائرة إلغاء الغرامة أيضاً؛ لأن واضع اللائحة عام 1438هـ لم يقصد هذه الدراجات، فهي مسكوت عنها، ونصوص العقوبات لا يُتوسع فيها ولا يُقاس عليها، والتصريح التجريبي هو النص الخاص بنشاط المدعية، ولم يرتب على مخالفة نقاط التجميع غرامة.","ruling":"فلهذه الأسباب حكمت الدائرة بالأغلبية: أولاً: رفض طلب إلغاء قرار الغرامة. ثانياً: إلغاء قرار مصادرة الدراجات."},{"t":"إنهاء عقد عامل رفض العودة من العمل عن بعد","court":"المحكمة العمالية بمنطقة (…) — الدائرة العمالية الثانية","meta":["رقم القضية: (5187) لعام 1447هـ — تاريخ الحكم: 1447/06/19هـ","المدعي: هيثم (…)، مطور برمجيات — المدعى عليها: شركة (ت) للتقنية","موضوع الدعوى: المطالبة بالتعويض عن إنهاء العقد، ومكافأة نهاية الخدمة، وأجر مدة الإشعار"],"facts":["تتلخص الوقائع في أن المدعي يعمل لدى المدعى عليها منذ عام 1443هـ براتب شهري قدره ثمانية عشر ألف ريال، وينص عقده على أن «مكان العمل: مقر الشركة بمدينة الرياض». وفي 1444/3هـ أرسلت إليه إدارة الموارد البشرية رسالة نصها: «يُسمح لك بالعمل عن بعد من مدينة أبها حتى إشعار آخر»، فعمل عن بعد ثلاث سنوات بتقييمات أداء ممتازة.","وفي 1447/2/1هـ أرسلت إليه الشركة: «يجب حضورك إلى المقر اعتباراً من 1447/2/8هـ»، فطلب مهلة ستين يوماً لنقل أسرته وأبنائه من مدارسهم، فرُفض طلبه. واستمر يعمل عن بعد ولم يحضر إلى المقر، وتظهر سجلات نظام الشركة دخوله اليومي وتسليمه مهامه. فأنذرته الشركة كتابياً في 1447/2/18هـ لغيابه عشرة أيام، ثم أنهت عقده في 1447/2/24هـ دون مكافأة أو تعويض، استناداً إلى حالة الغياب الواردة في المادة (الثمانين) من نظام العمل. وبعد تعذر التسوية الودية أقام دعواه، وأجابت الشركة بأن الإذن كان مؤقتاً، وأن المدعي رفض أمراً مشروعاً وتغيب بعد إنذاره."],"reasons":["وحيث إن الإذن بالعمل عن بعد مقيد بعبارة «حتى إشعار آخر»، وقد وجهت الشركة الإشعار، فيعود مكان العمل إلى ما نص عليه العقد.","وحيث إن على العامل تنفيذ الأوامر المشروعة لصاحب العمل، وعدم حضور المدعي إلى المقر بعد الموعد المحدد يُعد غياباً عن العمل دون سبب مشروع، وقد أنذرته الشركة كتابياً قبل إنهاء عقده.","وحيث إن إنهاء العقد وقع في الحالة التي أجازها النظام دون مكافأة أو تعويض؛ فإن دعوى المدعي تكون في غير محلها."],"ruling":"فلهذه الأسباب حكمت الدائرة: رفض الدعوى."},{"t":"«أقدم استقالتي» بسبب تأخر الرواتب","court":"محكمة الاستئناف بمنطقة (…) — الدائرة العمالية","meta":["رقم القضية الاستئنافية: (1306) لعام 1447هـ — تاريخ الحكم: 1447/10/05هـ","المستأنفة: مؤسسة (ف) للتجارة — المستأنف ضده: محمد (…)، محاسب","موضوع الاستئناف: الاعتراض على الحكم بمكافأة نهاية الخدمة كاملة"],"facts":["تتلخص الوقائع في أن المستأنف ضده عمل لدى المستأنفة ثماني سنوات براتب شهري قدره تسعة آلاف ريال، ولم تصرف له المستأنفة رواتب أشهر محرم وصفر وربيع الأول من عام 1447هـ. فأرسل إليها في 1447/4/2هـ رسالة نصها: «نظراً لعدم صرف رواتبي منذ ثلاثة أشهر، أقدم استقالتي اعتباراً من تاريخه». ثم أقام دعواه مطالباً بالرواتب المتأخرة، ومكافأة نهاية الخدمة كاملة، والتعويض.","فحكمت المحكمة العمالية له بالرواتب المتأخرة وقدرها سبعة وعشرون ألف ريال، وبالمكافأة كاملة؛ لأنه ترك العمل بسبب إخلال صاحب العمل بالتزام جوهري، وهي من الحالات التي أجاز فيها نظام العمل للعامل ترك العمل مع احتفاظه بحقوقه كاملة، ورفضت طلب التعويض. فاستأنفت المؤسسة، وقالت: إن العامل استقال بلفظ صريح، وإن تأخر الرواتب سببه ظروف مالية قاهرة بعد خسارتها عقداً كبيراً."],"reasons":["وحيث إن المستأنف ضده صرّح بلفظ الاستقالة، واللفظ الصريح لا يُعدل عنه إلى غيره، والاستقالة إنهاء للعقد بإرادة العامل، فيستحق ثلثي المكافأة؛ لأن خدمته زادت على خمس سنوات ولم تبلغ عشراً.","وحيث إن ذكر العامل سبب استقالته لا يغير طبيعة الإنهاء؛ فالعبرة بمن أنهى العقد لا بباعثه.","وحيث إن خسارة عقد تجاري ليست قوة قاهرة تعفي صاحب العمل من دفع الأجور، فيتعين تأييد الحكم في الرواتب المتأخرة."],"ruling":"فلهذه الأسباب حكمت الدائرة: تعديل الحكم المستأنف بجعل مكافأة نهاية الخدمة ثلثي المكافأة، وتأييده فيما عدا ذلك."},{"t":"شرط عدم المنافسة في المملكة كلها","court":"المحكمة العمالية بمنطقة (…) — الدائرة العمالية الأولى","meta":["رقم القضية: (6021) لعام 1447هـ — تاريخ الحكم: 1447/09/11هـ","المدعية: شركة (د) لتوزيع الأدوية — المدعى عليه: طارق (…)، مدير مبيعات سابق","موضوع الدعوى: المطالبة بالتعويض المتفق عليه لمخالفة شرط عدم المنافسة"],"facts":["تتلخص الوقائع في أن المدعى عليه عمل لدى المدعية مديراً للمبيعات في منطقة القصيم وحدها، يدير علاقتها بستين صيدلية. ونص عقده على أن:",">«يلتزم الطرف الثاني بعدم العمل لدى أي منشأة منافسة داخل المملكة لمدة سنتين من تاريخ انتهاء العقد، وإلا التزم بدفع مئتي ألف ريال».","فاستقال في 1447/1/30هـ، والتحق في 1447/5/1هـ بشركة منافسة مديراً للمبيعات في مدينة جدة، فأقامت المدعية دعواها تطالبه بمئتي ألف ريال. ودفع المدعى عليه ببطلان الشرط لأنه يشمل المملكة كلها وهو لم يعمل إلا في القصيم، وبأنه لم يطلع على أسرار تخص غير القصيم، وبأن المبلغ مبالغ فيه. وأجابت المدعية بأن الشرط مكتوب ومحدد المدة والمكان ونوع العمل، وبأن مدير المبيعات يطلع على سياسات التسعير في الشركة كلها."],"reasons":["وحيث إن نظام العمل أجاز شرط عدم المنافسة متى كان مكتوباً، ومحدداً من حيث الزمان والمكان ونوع العمل، وبالقدر الضروري لحماية مصالح صاحب العمل المشروعة، وألا تزيد مدته على سنتين.","وحيث إن تحديد المكان بـ«المملكة» يجاوز القدر الضروري؛ لأن المدعى عليه لم يعمل إلا في منطقة القصيم، والعيب في جزء من الشرط لا يبطله كله، فتقصره الدائرة على منطقة القصيم.","وحيث إن المدعى عليه يعمل في مدينة جدة، فلا يكون قد خالف الشرط بعد قصره؛ فإن الدعوى تكون حرية بالرفض."],"ruling":"فلهذه الأسباب حكمت الدائرة: رفض الدعوى."},{"t":"إثبات ساعات العمل الإضافية برسائل «واتساب»","court":"المحكمة العمالية بمنطقة (…) — الدائرة العمالية الثالثة","meta":["رقم القضية: (4410) لعام 1447هـ — تاريخ الحكم: 1447/08/03هـ","المدعي: يوسف (…)، رئيس طهاة — المدعى عليها: مؤسسة (ط) للمطاعم","موضوع الدعوى: المطالبة بأجر ساعات العمل الإضافية"],"facts":["تتلخص الوقائع في أن المدعي عمل لدى المدعى عليها سنتين، وينص عقده على العمل ثماني ساعات يومياً ستة أيام في الأسبوع. وطالب بأجر ساعات إضافية يقدرها بثلاث ساعات يومياً في المتوسط، بمبلغ ثمانية وأربعين ألف ريال. وقدم أربعاً وسبعين صورة لرسائل «واتساب» من مدير المطعم يكلفه فيها بمهام بعد منتصف الليل، منها: «أقفل المطبخ بعد آخر طلب، الساعة 1:30»، وصورة لجدول الإغلاق المعلق في المطبخ، وطلب إلزام المدعى عليها بتقديم سجل الحضور من جهاز البصمة، واحتج بأن صاحب العمل ملزم بحفظ سجلات الحضور.","وأجاب ممثل المدعى عليها بإنكار الساعات الإضافية، وبأن الصور مصطنعة لا يُعرف مصدرها، وبأن جهاز البصمة كان معطلاً فلا سجل لديه."],"reasons":["وحيث إن صور الرسائل لا يُعرف مصدرها، وقد أنكرها المدير، ولم يوثقها المدعي، فلا يُعتد بها في الإثبات.","وحيث إن البينة على من ادعى، ولم يثبت المدعي ساعات العمل الإضافية تحديداً، والمطالبة بمبلغ تقديري لا تكفي للحكم.","وحيث إن المدعى عليها قررت أن جهاز البصمة كان معطلاً، فلا وجه لإلزامها بتقديم سجل غير موجود؛ فإن الدعوى تكون حرية بالرفض."],"ruling":"فلهذه الأسباب حكمت الدائرة: رفض الدعوى."},{"t":"حذف صانع محتوى إعلاناً بعد اثنتي عشرة ساعة","court":"المحكمة التجارية بمنطقة (…) — الدائرة التجارية الرابعة","meta":["رقم القضية: (3746) لعام 1447هـ — تاريخ الحكم: 1447/07/22هـ","المدعية: مؤسسة (ح) للقهوة — المدعى عليها: مؤسسة (ل) للدعاية والإعلان، لمالكها صانع المحتوى (…)","موضوع الدعوى: المطالبة برد مقابل إعلان، والتعويض"],"facts":["تتلخص الوقائع في أن الطرفين أبرما في 1447/3/1هـ عقداً نصه:",">«يلتزم الطرف الثاني بنشر مقطع إعلاني عن منتجات الطرف الأول في حسابه على منصة (سناب شات)، مقابل خمسة وعشرين ألف ريال تُدفع مقدماً».","فنشر المدعى عليه المقطع في «القصص» في 1447/3/10هـ، ثم حذفه بعد اثنتي عشرة ساعة بسبب تعليقات سلبية، فبلغت مشاهداته واحداً وأربعين ألفاً، ومتوسط مشاهدات قصصه في أربع وعشرين ساعة مئة وثمانون ألفاً.","فأقامت المدعية دعواها طالبة رد المقابل، وتعويضها بعشرة آلاف ريال، وقدمت ثلاثة عقود لصناع محتوى آخرين تنص على بقاء الإعلان أربعاً وعشرين ساعة، وقالت إن هذا هو المتعارف عليه في السوق. وأجاب المدعى عليه بأنه التزم بالنشر وقد نشر، وبأن العقد لم يحدد مدة، وبأن حذفه المقطع حق له لحماية حسابه."],"reasons":["وحيث إن العقد شريعة المتعاقدين، والالتزام الوارد فيه هو النشر، وقد تحقق بنشر المقطع، والعقد خلا من تحديد مدة بقائه، والمطلق يجري على إطلاقه، فلا يُلزم المدعى عليه بما لم يلتزم به، ويتعين رفض طلب رد المقابل.","وحيث إن حذف المقطع بعد اثنتي عشرة ساعة ينافي حسن النية في تنفيذ العقد، فتقدّر الدائرة للمدعية تعويضاً قدره خمسة آلاف ريال."],"ruling":"فلهذه الأسباب حكمت الدائرة: أولاً: رفض طلب رد المقابل. ثانياً: إلزام المدعى عليها بأن تدفع للمدعية خمسة آلاف ريال تعويضاً."},{"t":"مسؤولية تطبيق التوصيل عن الطلبات المفقودة","court":"محكمة الاستئناف بمنطقة (…) — الدائرة التجارية الثانية","meta":["رقم القضية الاستئنافية: (2093) لعام 1447هـ — تاريخ الحكم: 1448/01/30هـ","المستأنفة: مؤسسة (س) للمطاعم — المستأنف ضدها: شركة (و) لتطبيقات التوصيل","موضوع الاستئناف: الاعتراض على حكم رفض دعوى استرداد مبالغ حسمها تطبيق التوصيل"],"facts":["تتلخص الوقائع في أن المستأنفة متعاقدة مع تطبيق التوصيل وفق شروط وافقت عليها إلكترونياً، ينص البند (12) منها على أن:",">«يتحمل المطعم قيمة الطلبات التي لا تصل إلى العميل لأي سبب».","وخلال شهرين أبلغ العملاء عن عدم وصول مئة وأربعين طلباً، مع أن سجلات التطبيق تثبت في جميعها عبارة «تم الاستلام من المطعم»، فرد التطبيق المبالغ إلى العملاء، وحسم من مستحقات المستأنفة واحداً وعشرين ألف ريال.","فأقامت المستأنفة دعواها، فحكمت المحكمة التجارية برفضها؛ لأن البند واضح ووافقت عليه المستأنفة. فاستأنفت، وقالت: إن المسؤولية تنتقل إلى التطبيق بتسلّم مندوبه الطلب، والبند جائر. وأجابت المستأنف ضدها بأنها وسيط تقني، وبأن المندوبين مستقلون يعملون لحسابهم، وبأن البند واضح."],"reasons":["وحيث ثبت من مستندات المستأنف ضدها أنها تتقاضى عمولة قدرها اثنان وعشرون في المئة عن كل طلب، وتحدد للمندوب الطلب ومساره وأجرته وتقيّمه وتوقفه، فالمندوبون يعملون في حقيقة الأمر لحسابها.","وحيث إن «الغنم بالغرم»، فمن يأخذ عمولة الطلب يتحمل تبعة هلاكه بعد تسلّمه، و«لا ضرر ولا ضرار»، وتحميل المطعم ما يهلك بعد خروج الطلب من يده ينافي طبيعة المعاملة؛ ولذلك لا ينصرف البند (12) إلى الطلبات التي ثبت تسلّم المندوب لها.","وحيث إن الحكم المستأنف أخذ بظاهر البند دون النظر في ذلك؛ فإنه يتعين نقضه."],"ruling":"فلهذه الأسباب حكمت الدائرة: نقض الحكم المستأنف، وإلزام المستأنف ضدها بأن ترد إلى المستأنفة واحداً وعشرين ألف ريال."},{"t":"قبول تطبيق برمجي بالسكوت وملاحظات «واتساب»","court":"المحكمة التجارية بمنطقة (…) — الدائرة التجارية الثانية","meta":["رقم القضية: (4128) لعام 1447هـ — تاريخ الحكم: 1447/08/26هـ","المدعية: شركة (ب) للبرمجيات — المدعى عليها: شركة (ق) للنقل","موضوع الدعوى: المطالبة بباقي قيمة عقد تطوير تطبيق، ودعوى متقابلة بالفسخ والاسترداد"],"facts":["تتلخص الوقائع في أن الطرفين تعاقدا في 1446/12/1هـ على تطوير تطبيق لإدارة أسطول الشاحنات بثلاثمئة ألف ريال، دُفع نصفها، ومما نص عليه العقد:",">البند (9): «يُعد عدم إرسال العميل ملاحظاته كتابة إلى البريد الإلكتروني الرسمي للمطور خلال عشرة أيام من التسليم قبولاً نهائياً للتطبيق».",">البند (15): «تكون جميع الإخطارات بين الطرفين على العناوين الرسمية المدونة في العقد».","وسُلّم التطبيق في 1447/3/10هـ، ومن اليوم الثالث إلى الثامن أرسل مدير تقنية المعلومات لدى المدعى عليها ثلاثاً وعشرين رسالة «واتساب» إلى مدير المشروع لدى المدعية تتضمن أعطالاً، فرد عليها وأصلح تسعة منها. وفي اليوم الرابع عشر أرسلت المدعى عليها إلى البريد الرسمي رفضها التطبيق.","فأقامت المدعية دعواها تطالب بباقي القيمة وقدره مئة وخمسون ألف ريال، وأقامت المدعى عليها دعوى متقابلة بفسخ العقد واسترداد ما دفعته، وقدمت تقرير خبير يثبت أربعة عشر عطلاً تمنع تتبع الشاحنات."],"reasons":["وحيث إن البندين (9) و(15) اشترطا أن تكون الملاحظات كتابة على البريد الرسمي، ورسائل «واتساب» إلى أحد الموظفين ليست الإخطار المتفق عليه، فيكون سكوت المدعى عليها عشرة أيام قبولاً نهائياً للتطبيق، ويلزمها دفع باقي القيمة.","وحيث إن القبول أصبح نهائياً، فلا محل لبحث ما تثيره المدعى عليها من أعطال، وتكون دعواها المتقابلة حرية بالرفض."],"ruling":"فلهذه الأسباب حكمت الدائرة: أولاً: إلزام المدعى عليها بأن تدفع للمدعية مئة وخمسين ألف ريال. ثانياً: رفض الدعوى المتقابلة."},{"t":"حوالات احتيالية ودفع بعدم الاختصاص متأخر","court":"المحكمة التجارية بمنطقة (…) — الدائرة التجارية السادسة","meta":["رقم القضية: (5530) لعام 1447هـ — تاريخ الحكم: 1447/09/24هـ","المدعي: سلمان (…) — المدعى عليه: مصرف (ص)","موضوع الدعوى: المطالبة بتعويض عن حوالات احتيالية"],"facts":["تتلخص الوقائع في أن محتالاً استخرج في 1447/1/15هـ شريحة بديلة لرقم جوال المدعي، ثم أجرى من حسابه ثلاث حوالات إلى مستفيد جديد خلال ساعة واحدة بعد الثانية فجراً، مجموعها ثمانية وأربعون ألف ريال. فأقام المدعي دعواه على المصرف يطالبه بالمبلغ، وقال: إن المصرف لم يطبق تحققاً إضافياً عند إضافة المستفيد الجديد مع ضخامة الحوالات وتوقيتها.","وأجاب ممثل المصرف في ثلاث جلسات عن الموضوع بأن الحوالات تمت برمز التحقق المرسل إلى الرقم المسجل، والعميل مسؤول عن شريحته. وفي الجلسة الرابعة دفع بعدم اختصاص المحكمة؛ لأن المنازعات بين المصارف وعملائها من اختصاص لجنة المنازعات المصرفية."],"reasons":["وحيث إن الدفع بعدم الاختصاص يجب إبداؤه قبل أي دفاع في الموضوع، وقد أجاب المصرف عن الموضوع في ثلاث جلسات قبل أن يدفع به، فيكون قد سقط حقه في إبدائه، فتلتفت الدائرة عنه.","وحيث إن على المصرف بصفته محترفاً أن يتخذ من وسائل كشف الاحتيال ما يناسب العمليات غير المعتادة، وإضافة مستفيد جديد وتحويل مبالغ كبيرة إليه فجراً خلال ساعة عمليات غير معتادة، فيكون تقصيره في التحقق خطأً يوجب ضمان ما ترتب عليه."],"ruling":"فلهذه الأسباب حكمت الدائرة: إلزام المدعى عليه بأن يدفع للمدعي ثمانية وأربعين ألف ريال."},{"t":"ألواح شمسية على سطح فيلا مؤجرة","court":"المحكمة العامة بمحافظة (…) — الدائرة الحقوقية الرابعة","meta":["رقم القضية: (2875) لعام 1447هـ — تاريخ الحكم: 1447/05/12هـ","المدعي: صالح (…) (المؤجر) — المدعى عليه: فهد (…) (المستأجر)","موضوع الدعوى: طلب إزالة ألواح شمسية، والتعويض، وفسخ عقد الإيجار"],"facts":["تتلخص الوقائع في أن الطرفين أبرما عقد إيجار سكني لفيلا مدته ثلاث سنوات تبدأ من 1446/1/1هـ، ونص البند (10) منه على أنه:",">«لا يحق للمستأجر إجراء أي تعديلات إنشائية على العين المؤجرة دون موافقة خطية من المؤجر».","وفي 1446/10هـ ركّب المستأجر على سطح الفيلا اثني عشر لوحاً شمسياً على قواعد من الألمنيوم مثبتة بمسامير في سطح المبنى، بنحو أربعين ثقباً، مع محول كهربائي في الفناء، لتخفيض فاتورة الكهرباء.","فأقام المؤجر دعواه طالباً إزالة الألواح، وتعويضه بعشرين ألف ريال لإعادة عزل السطح، وفسخ العقد، وقدّم عرض سعر من مقاول عزل. وأجاب المستأجر بأن الألواح قابلة للفك وليست إنشائية، وبأنه لم يحدث أي تسرب، وتعهد بفكها وإصلاح الثقوب عند انتهاء العقد."],"reasons":["وحيث إن كل ما يُثبت في سطح العقار بالحفر يُعد تعديلاً إنشائياً؛ لأنه يمس سلامة المبنى، فيكون المستأجر قد خالف البند (10) من العقد، ويلزمه إزالة الألواح.","وحيث إن المؤجر قدّم عرض سعر لإعادة العزل بعشرين ألف ريال، فيلزم المستأجر بدفعه جبراً للضرر.","وحيث إن المخالفة لا تبلغ حداً يوجب فسخ العقد، فيتعين رفض طلب الفسخ."],"ruling":"فلهذه الأسباب حكمت الدائرة: أولاً: إلزام المدعى عليه بإزالة الألواح الشمسية خلال ثلاثين يوماً. ثانياً: إلزامه بأن يدفع للمدعي عشرين ألف ريال. ثالثاً: رفض طلب فسخ العقد."},{"t":"بيع سيارة «بحالتها» مع التلاعب بالعداد","court":"محكمة الاستئناف بمنطقة (…) — الدائرة الحقوقية الثالثة","meta":["رقم القضية الاستئنافية: (1652) لعام 1447هـ — تاريخ الحكم: 1447/08/15هـ","المستأنف: ماجد (…) (البائع) — المستأنف ضده: بندر (…) (المشتري)","موضوع الاستئناف: الاعتراض على حكم فسخ بيع سيارة"],"facts":["تتلخص الوقائع في أن المستأنف عرض سيارته في منصة لبيع السيارات بإعلان نصه: «موديل 2019، ممشى 85 ألف كم، صيانة وكالة». فاشتراها المستأنف ضده في 1447/2/3هـ باثنين وستين ألف ريال، ونص العقد على أنه:",">«باع الطرف الأول السيارة بحالتها الراهنة التي عاينها المشتري ورضي بها، دون أدنى مسؤولية على البائع بعد التسليم».","وفي 1447/2/28هـ تبيّن للمشتري من سجل صيانة الوكالة أن عداد السيارة كان يسجل مئتين وعشرة آلاف كيلومتر في آخر صيانة لها عام 1445هـ. فأقام دعواه طالباً فسخ البيع، فحكمت المحكمة العامة بفسخه وإلزام البائع برد الثمن مقابل إعادة السيارة؛ لأن البائع غرّر بالمشتري بإعلانه. فاستأنف البائع، وقال: إن المشتري عاين السيارة وجربها، ورضي بها بحالتها، والعداد ظاهر أمامه، وتأخر في اعتراضه خمسة وعشرين يوماً."],"reasons":["وحيث إن الطرفين اتفقا على البيع بحالة السيارة بعد معاينتها، ورضي المشتري بذلك صراحة، والعقد شريعة المتعاقدين.","وحيث إن ما يظهر في العداد مطابق لما ذكره البائع، وكان بوسع المشتري الرجوع إلى سجل الصيانة قبل الشراء، فلا يعذر بتقصيره.","وحيث إن الإعلان دعوة إلى التعاقد، وليس جزءاً من العقد الذي استقر عليه الطرفان؛ فإن الحكم المستأنف يكون في غير محله، متعيناً نقضه."],"ruling":"فلهذه الأسباب حكمت الدائرة: نقض الحكم المستأنف، ورفض الدعوى."},{"t":"حريق قاعة أفراح وعربون «غير مسترد»","court":"المحكمة التجارية بمنطقة (…) — الدائرة التجارية الثالثة","meta":["رقم القضية: (6213) لعام 1447هـ — تاريخ الحكم: 1448/02/19هـ","المدعي: عبدالمجيد (…) — المدعى عليها: مؤسسة (ز) لقاعات الأفراح","موضوع الدعوى: المطالبة برد عربون حجز قاعة"],"facts":["تتلخص الوقائع في أن المدعي حجز قاعة المدعى عليها لحفل زواج في 1447/10/20هـ بستين ألف ريال، دفع منها ثلاثين ألفاً عربوناً، ونص العقد على أن:",">«العربون غير مسترد في حال إلغاء الحجز».","وفي 1447/10/13هـ شب حريق في مطبخ القاعة جعلها غير صالحة للاستعمال، فعرضت المدعى عليها على المدعي أحد أمرين: تأجيل الحفل ثلاثة أشهر، أو إقامته في موعده في قاعة أخرى تملكها أقل درجة تتسع لنصف المدعوين.","فرفض المدعي البديلين؛ لأن الدعوات قد وُزعت، والقاعة البديلة لا تتسع للمدعوين، وطالب برد العربون. وأجابت المدعى عليها بأن رفضه البدائل إلغاء للحجز من جهته، والعربون غير مسترد بنص العقد، والحريق قوة قاهرة لا يد لها فيه."],"reasons":["وحيث إن المدعى عليها عرضت على المدعي بديلين معقولين، فرفضهما، فيكون الإلغاء قد وقع من جهته، ويسري عليه نص العقد بأن العربون غير مسترد.","وحيث إن الحريق قوة قاهرة لا يد للمدعى عليها فيه، فلا تُسأل عن عدم تنفيذ التزامها في الموعد."],"ruling":"فلهذه الأسباب حكمت الدائرة: رفض الدعوى."},{"t":"كاميرا جار تكشف باب جاره وفناءه","court":"المحكمة العامة بمحافظة (…) — الدائرة الحقوقية الثالثة","meta":["رقم القضية: (3304) لعام 1447هـ — تاريخ الحكم: 1447/06/28هـ","المدعي: إبراهيم (…) — المدعى عليه: سامي (…)","موضوع الدعوى: طلب إزالة كاميرا مراقبة، والتعويض"],"facts":["تتلخص الوقائع في أن المدعى عليه ركّب كاميرا مراقبة على الجدار الخارجي لمنزله بعد سرقة سيارتين في الحي، وتغطي الكاميرا باب منزل المدعي المقابل، وجزءاً من فنائه الذي تجلس فيه أسرته متى فُتح الباب. فأقام المدعي دعواه طالباً إزالة الكاميرا، وتعويضه بعشرة آلاف ريال عما لحقه وأسرته من أذى نفسي.","وأجاب المدعى عليه بأنه ركّب الكاميرا لحماية منزله وسيارته، وبأنها مثبتة في ملكه وتصور الشارع وهو مكان عام، وأبدى استعداده لتعديل اتجاهها."],"reasons":["وحيث إن للمالك أن يحمي ملكه، لكن ليس له أن يضر بجاره؛ لقاعدة «لا ضرر ولا ضرار».","وحيث إن انكشاف باب المدعي وفنائه للكاميرا مفسدة، وحماية منزل المدعى عليه مصلحة، و«درء المفاسد مقدم على جلب المصالح»، ويمكن تحقيق المصلحة بتعديل اتجاه الكاميرا دون إزالتها.","وحيث إن المدعي لم يقدم ما يثبت الأذى الذي يدعيه، فيتعين رفض طلب التعويض."],"ruling":"فلهذه الأسباب حكمت الدائرة: أولاً: إلزام المدعى عليه بتعديل اتجاه الكاميرا بحيث لا تغطي باب منزل المدعي ولا فناءه، خلال خمسة عشر يوماً. ثانياً: رفض طلب التعويض."},{"t":"عمولة وسيط بعد انتهاء عقد الوساطة","court":"المحكمة العامة بمحافظة (…) — الدائرة الحقوقية الأولى","meta":["رقم القضية: (4017) لعام 1447هـ — تاريخ الحكم: 1447/07/09هـ","المدعي: مكتب (ك) للوساطة العقارية — المدعى عليه: حمد (…) (مالك الأرض)","موضوع الدعوى: المطالبة بعمولة وساطة عقارية"],"facts":["تتلخص الوقائع في أن الطرفين أبرما عقد وساطة حصرية لبيع أرض المدعى عليه، مدته من 1447/1/1هـ إلى 1447/3/30هـ، ونص البند (4) منه على أنه:",">«يستحق الوسيط عمولة قدرها (2.5%) من قيمة البيع إذا تم البيع خلال مدة هذا العقد».","وأحضر المكتب مشترياً عاين الأرض في 1447/3/20هـ، كما يثبت سجل المعاينات في منصة الوساطة، ثم باع المدعى عليه الأرض للمشتري نفسه في 1447/4/5هـ بمليون وستمئة ألف ريال.","فأقام المكتب دعواه يطالب بأربعين ألف ريال، وقدّم رسالة «واتساب» من المدعى عليه إلى المشتري في 1447/3/25هـ نصها: «خلنا نصبر أسبوعين لين يخلص عقد المكتب ونوفر العمولة». وأجاب المدعى عليه بأن العقد قصر العمولة على البيع خلال مدته، وبأن الرسالة كانت مزاحاً أثناء التفاوض."],"reasons":["وحيث إن البند (4) قصر استحقاق العمولة على البيع الذي يتم خلال مدة العقد، ومفهوم المخالفة أن البيع بعد انتهاء المدة لا عمولة فيه.","وحيث إن العقد شريعة المتعاقدين، وقد تم البيع بعد انتهاء المدة، والرسالة المقدمة لا تغير ما اتفق عليه الطرفان؛ فإن الدعوى تكون حرية بالرفض."],"dissent":"يرى أحد أعضاء الدائرة الحكم للمكتب بالعمولة؛ لأن مفهوم المخالفة لا يُعمل به إذا كان المسكوت عنه ثمرة تحايل، والرسالة تدل على تأخير البيع قصداً لإسقاط العمولة، ومن قصد إسقاط حق غيره بحيلة عومل بنقيض قصده، والبيع إنما تم بسعي المكتب خلال مدة العقد.","ruling":"فلهذه الأسباب حكمت الدائرة بالأغلبية: رفض الدعوى."},{"t":"رسوم جمعية الملاك مع تعطل المصعد","court":"المحكمة العامة بمحافظة (…) — الدائرة الحقوقية الخامسة","meta":["رقم القضية: (2490) لعام 1447هـ — تاريخ الحكم: 1447/06/06هـ","المدعية: جمعية ملاك عمارة (…) ممثلة بمديرها — المدعى عليه: وليد (…)، مالك شقة في الدور الخامس","موضوع الدعوى: المطالبة برسوم الخدمات"],"facts":["تتلخص الوقائع في أن البند (7) من النظام الأساسي لجمعية الملاك ينص على أنه:",">«يلتزم كل مالك بسداد رسم خدمات سنوي قدره (3,600) ريال، ولا يجوز الامتناع عن السداد لأي سبب».","وتعطل مصعد العمارة سبعة أشهر من عام 1446هـ بانتظار قطعة غيار، فامتنع المدعى عليه عن سداد رسوم عامي 1446هـ و1447هـ، ومجموعها سبعة آلاف ومئتا ريال، فأقام مدير الجمعية الدعوى للمطالبة بها.","ودفع المدعى عليه بعدم قبول الدعوى لانعدام صفة رافعها؛ لأن مدة المدير انتهت في 1447/1/1هـ ولم تجددها له الجمعية العمومية. وأجاب في الموضوع بأن الجمعية لم تقدم الخدمة، فامتنع عن الرسم مقابل عدم الخدمة، وطلب احتياطياً تخفيض الرسم بقدر مدة تعطل المصعد."],"reasons":["وحيث إن المدير يستمر في تسيير شؤون الجمعية بعد انتهاء مدته حتى يُعيَّن خلفه، منعاً لتعطل مصالح الملاك، فتكون صفته في رفع الدعوى قائمة، ويتعين رد الدفع.","وحيث إن النظام الأساسي للجمعية نص على عدم جواز الامتناع عن السداد لأي سبب، وتعطل المصعد كان بسبب تأخر المورد فلا يد للجمعية فيه؛ فإن المدعى عليه يلزمه سداد الرسوم كاملة."],"ruling":"فلهذه الأسباب حكمت الدائرة: إلزام المدعى عليه بأن يدفع للمدعية سبعة آلاف ومئتي ريال."},{"t":"صورة مصور استُعملت في حملة إعلانية","court":"المحكمة التجارية بمنطقة (…) — الدائرة التجارية الأولى","meta":["رقم القضية: (5902) لعام 1447هـ — تاريخ الحكم: 1447/11/13هـ","المدعي: سعود (…)، مصور محترف — المدعى عليها: شركة (هـ) للتطوير العقاري","موضوع الدعوى: المطالبة بالتعويض عن الاعتداء على حق المؤلف"],"facts":["تتلخص الوقائع في أن المدعي نشر في حسابه على منصة «إنستغرام» في 1446/8هـ صورة التقطها لجبل وقت الغروب، تحمل علامته المائية. فاستعملتها المدعى عليها في حملة لوحات إعلانية في ثلاث مدن وفي إعلانات ممولة بين 1447/1هـ و1447/3هـ، بعد قص العلامة المائية، وكتبت تحتها: «المصدر: الإنترنت». ولما أنذرها المدعي في 1447/3/15هـ أزالت الإعلانات خلال عشرة أيام.","فأقام دعواه يطالب بمئة ألف ريال تعويضاً، وقدّم قائمة أسعاره المنشورة لترخيص صوره، وفيها اثنا عشر ألف ريال عن كل استعمال تجاري في المدينة الواحدة. وأجابت المدعى عليها بأن الصورة منشورة للعموم في الإنترنت، وبأنها ذكرت المصدر، وبأن إزالتها الإعلانات بعد الإنذار دليل حسن نيتها."],"reasons":["وحيث إن نشر المؤلف صورته للعموم لا يبيح لغيره استعمالها تجارياً دون إذنه، وعبارة «المصدر: الإنترنت» ليست نسبة للمصنف إلى مؤلفه، فتكون المدعى عليها قد اعتدت على حق المدعي.","وحيث إن الدائرة، بالنظر إلى ظروف الدعوى وملابساتها، تقدّر التعويض بخمسة عشر ألف ريال."],"ruling":"فلهذه الأسباب حكمت الدائرة: إلزام المدعى عليها بأن تدفع للمدعي خمسة عشر ألف ريال."},{"t":"صور مدرب سابق في إعلانات النادي","court":"المحكمة العمالية بمنطقة (…) — الدائرة العمالية الرابعة","meta":["رقم القضية: (6688) لعام 1447هـ — تاريخ الحكم: 1447/09/02هـ","المدعي: رائد (…)، مدرب لياقة سابق — المدعى عليها: مؤسسة (ج) للأندية الرياضية","موضوع الدعوى: طلب إزالة صور المدعي من مواد التسويق، والتعويض"],"facts":["تتلخص الوقائع في أن عقد عمل المدعي المبرم عام 1444هـ ينص على أن:",">«يوافق الموظف على استخدام صوره ومقاطعه المصورة في أغراض التسويق».","فاستقال المدعي في 1446/12هـ والتحق بنادٍ آخر، وبقيت صوره في إعلانات المدعى عليها وموقعها الإلكتروني تحت عبارة «مدربنا المميز». فأرسل إليها في 1447/2/1هـ إشعاراً بالرجوع عن موافقته، وطلب حذف صوره، فرفضت.","فأقام دعواه طالباً إزالة صوره، وتعويضه بثلاثين ألف ريال، واحتج بحقه في الرجوع عن موافقته على معالجة بياناته الشخصية وفق نظام حماية البيانات الشخصية، وبأن عبارة «مدربنا المميز» توهم الناس أنه ما زال يعمل لديها. وأجابت المدعى عليها بأن البند غير مقيد بمدة، وبأن الموافقة جزء من عقد قابلها الراتب، وبأن الصور ملكها؛ لأن مصورها هو الذي التقطها."],"reasons":["وحيث إن البند جاء مطلقاً غير مقيد بمدة العقد، والمطلق يجري على إطلاقه، فتبقى الموافقة قائمة بعد انتهاء العلاقة.","وحيث إن الموافقة وردت في عقد قابلها أجر، فلا يملك المدعي الرجوع عنها بإرادته المنفردة، والصور ملك المدعى عليها لأنها التي التقطتها؛ فإن الدعوى تكون حرية بالرفض."],"ruling":"فلهذه الأسباب حكمت الدائرة: رفض الدعوى."},{"t":"تأخر تسليم شقة مبيعة على الخارطة","court":"المحكمة التجارية بمنطقة (…) — الدائرة التجارية الخامسة","meta":["رقم القضية: (6450) لعام 1447هـ — تاريخ الحكم: 1448/03/04هـ","المدعي: عادل (…) — المدعى عليها: شركة (غ) للتطوير العقاري","موضوع الدعوى: طلب فسخ عقد بيع على الخارطة، ورد الثمن، والتعويض"],"facts":["تتلخص الوقائع في أن المدعي اشترى من المدعى عليها في 1443/6/1هـ شقة على الخارطة بتسعمئة ألف ريال، دفع منها سبعمئة وخمسة وستين ألفاً، على أن تُسلّم في 1445/6/1هـ. ونص البند (11) من العقد على أنه:",">«إذا تأخر المطور في التسليم التزم بدفع غرامة تأخير قدرها (0.5%) من الثمن عن كل شهر تأخير، بحد أقصى (5%) من الثمن، ويكون ذلك تعويضاً نهائياً عن التأخير».","ولم تُسلّم الشقة حتى رفع الدعوى في 1447/8هـ، أي بعد ستة وعشرين شهراً من الموعد، ونسبة الإنجاز سبعون في المئة بحسب تقرير المكتب الهندسي.","فأقام المدعي دعواه طالباً فسخ العقد، ورد ما دفعه، وتعويضه عما دفعه من أجرة سكن مدة التأخير بمئة وأربعة آلاف ريال. وأجابت المدعى عليها بأن البند (11) حدد جزاء التأخير، وبأن التأخير سببه نقص الإسمنت والحديد وهو قوة قاهرة، وتعهدت بالتسليم خلال ستة أشهر."],"reasons":["وحيث إن الطرفين اتفقا في البند (11) على جزاء التأخير، ونصا على أنه تعويض نهائي، فلا يحق للمدعي المطالبة بما يزيد عليه، ولا طلب الفسخ بسبب التأخير.","وحيث إن نقص مواد البناء أمر متوقع يمكن التحوط له، فلا يعد قوة قاهرة، فتلتزم المدعى عليها بالغرامة بحدها الأعلى، وقدره خمسة وأربعون ألف ريال."],"ruling":"فلهذه الأسباب حكمت الدائرة: أولاً: إلزام المدعى عليها بأن تدفع للمدعي خمسة وأربعين ألف ريال. ثانياً: رفض ما عدا ذلك من طلبات."},{"t":"استعمال الذكاء الاصطناعي في بحث جامعي","court":"المحكمة الإدارية بمنطقة (…) — الدائرة الإدارية الثالثة","meta":["رقم القضية: (3967) لعام 1447هـ — تاريخ الحكم: 1448/02/26هـ","المدعي: عمر (…)، طالب — المدعى عليها: جامعة (…)","موضوع الدعوى: طلب إلغاء قرار تأديبي بإلغاء درجة بحث وإنذار أكاديمي"],"facts":["تتلخص الوقائع في أن أستاذ أحد المقررات كلّف الطلاب ببحث يُعد في المنزل، ولم تتضمن تعليمات التكليف أي إشارة إلى برامج الذكاء الاصطناعي. فلما سلّم المدعي بحثه اشتبه الأستاذ في أنه مولّد آلياً، وأظهر تقرير برنامج كشف أن «احتمال أن يكون النص مولداً آلياً 87%». وأقر المدعي عند سؤاله بأنه استعمل برنامج ذكاء اصطناعي «لتحسين الصياغة فقط»، وأنه كتب الأفكار بنفسه، وقدم مسوداته بخط يده.","فقررت لجنة تأديب الطلاب إلغاء درجة البحث وإنذاره إنذاراً أكاديمياً، استناداً إلى المادة (5) من لائحة تأديب الطلاب، ونصها:",">«يُعد غشاً كل استعانة بالغير أو بأي وسيلة غير مسموح بها في أداء الاختبارات والتكاليف».","فتظلم فرُفض تظلمه، فأقام دعواه، وقال: إن البرنامج ليس «غيراً»، وإنه لم يُمنع منه قبل التكليف، وإن تقرير الكشف احتمال لا يقين، وإنه استعمله كما يستعمل المدقق الإملائي."],"reasons":["وحيث إن لفظ «الغير» يشمل الإنسان وبرامج الذكاء الاصطناعي؛ لأن هذه البرامج تؤدي عملاً ذهنياً كالذي يؤديه الإنسان.","وحيث إن التكليف يقيس قدرة الطالب نفسه، فكل وسيلة تنتج له النص غير مسموح بها بطبيعة التكليف ولو لم يُنص على منعها، وقد أقر المدعي باستعمال البرنامج، وعضد إقرارَه تقريرُ الكشف؛ فإن القرار يكون قائماً على سببه."],"dissent":"يرى أحد أعضاء الدائرة إلغاء القرار؛ لأن عبارة «غير مسموح بها» تفترض منعاً سابقاً ولم يوجد، والأصل في تصرفات الأفراد الإباحة، ولا عقوبة إلا بنص، وتقرير الكشف احتمال لا يبلغ الدليل، وإقرار المدعي مقصور على تحسين الصياغة، وهو غير كتابة البحث.","ruling":"فلهذه الأسباب حكمت الدائرة بالأغلبية: رفض الدعوى."}],"cases":[{"t":"استقالة لم تقبلها الشركة","who":"سعد (…)، محاسب في شركة خاصة","facts":["يعمل سعد في شركة خاصة بعقد غير محدد المدة منذ عام 1443هـ. وفي 1448/6/1هـ قدّم استقالته عبر منصة «قوى» وعبر البريد الإلكتروني للشركة، وذكر أنه سيستمر في العمل ثلاثين يوماً مدةً للإشعار.","فرد عليه مديره بأن الشركة «لا تقبل الاستقالة» حتى يدرب موظفاً بديلاً، وأنه إن ترك العمل بعد ثلاثين يوماً فسترفع الشركة عليه بلاغ «انقطاع عن العمل». ولدى سعد عرض عمل من جهة أخرى يبدأ في 1448/7/15هـ."],"docs":"طلب الاستقالة في «قوى»، ورسالة البريد، ورد المدير المكتوب، وعقد العمل.","q":["هل تتوقف نهاية العلاقة على قبول الشركة للاستقالة؟ ومتى تنتهي العلاقة نظاماً؟","ما أثر بلاغ الانقطاع لو رفعته الشركة؟ وكيف يحمي سعد نفسه منه؟","ما حقوقه المالية عند انتهاء العلاقة، ومنها مكافأة نهاية الخدمة؟"]},{"t":"هاتف وصل تالفاً من متجر إلكتروني","who":"ريان (…)، مستهلك","facts":["اشترى ريان في 1448/5/28هـ هاتفاً بأربعة آلاف ومئتي ريال من متجر إلكتروني سعودي، ووصله الطرد في 1448/6/2هـ، فصوّر فتحه بالفيديو، فإذا شاشة الهاتف مكسورة.","تواصل مع خدمة العملاء في اليوم نفسه، فرفض المتجر الإرجاع؛ لأن سياسته المنشورة في الموقع تنص على أنه «لا إرجاع ولا استبدال في الأجهزة الإلكترونية»، وعرض إصلاح الشاشة على أن يدفع ريان نصف تكلفة الإصلاح."],"docs":"الفاتورة الإلكترونية، ومقطع فتح الطرد، ومحادثة خدمة العملاء، وصورة من سياسة الإرجاع في الموقع.","q":["هل يحق لريان إرجاع الهاتف واسترداد ثمنه رغم سياسة المتجر؟","ما الجهة التي يشتكي إليها، وكيف؟ وهل لذلك مدة يجب أن يراعيها؟"]},{"t":"غرفة على السطح دون رخصة","who":"عبدالله (…)، مالك منزل","facts":["بنى عبدالله في 1447/12هـ غرفة على سطح منزله دون رخصة بناء. وفي 1448/5/25هـ وصلته عبر منصة «بلدي» مخالفة «بناء دون ترخيص» بغرامة، مع مهلة لتصحيح الوضع أو الإزالة.","يقول عبدالله إن جيرانه بنوا غرفاً مثلها ولم تُحرر عليهم مخالفات، وإن غرفته لا تطل على أحد ولا تضر بأحد."],"docs":"إشعار المخالفة، وصور الغرفة، وصك المنزل.","q":["ما الخيارات المتاحة لعبدالله نظاماً: الاعتراض على المخالفة، أم تصحيح الوضع؟ وما المواعيد التي يجب أن يراعيها؟","هل تنفعه حجة أن جيرانه لم تُحرر عليهم مخالفات؟","بماذا توصيه عملياً؟"]},{"t":"تقييم مسيء لمطعم في خرائط قوقل","who":"خالد (…)، صاحب مؤسسة مطعم","facts":["نشر حساب باسم مستعار في 1448/4/20هـ تقييماً للمطعم على خرائط قوقل، يقول فيه إن المطعم «يقدّم لحماً فاسداً ويسمم الزبائن»، وأرفق صورة لطبق تبيّن أنه ليس من أطباق المطعم.","انخفضت طلبات المطعم ثلاثين في المئة في الشهر التالي بحسب تقارير منصة التوصيل. وللمطعم شهادة فحص من البلدية في 1448/4/1هـ بلا ملاحظات."],"docs":"صورة التقييم ورابطه، وتقرير المبيعات الشهري، وشهادة الفحص.","q":["هل يُعد نشر هذا التقييم جريمة؟ وما تكييفها؟","كيف يصل خالد إلى صاحب الحساب المستعار؟ وما الجهة المختصة؟","هل يستطيع المطالبة بتعويض عن انخفاض المبيعات؟ وما الذي يلزمه إثباته؟"]},{"t":"شرط التحكيم في عقد توريد","who":"شركة (أ) للتجهيزات المكتبية","facts":["أبرمت الشركة في 1447/9هـ عقد توريد أثاث مع مصنع (ب)، ونص البند (14) منه على أنه: «يُحال أي نزاع ينشأ عن هذا العقد إلى التحكيم وفق نظام التحكيم السعودي».","تأخر المصنع في التوريد أربعة أشهر، فتضررت الشركة مع عملائها. وتريد الشركة رفع دعوى أمام المحكمة التجارية بدلاً من التحكيم؛ لأنها ترى التحكيم أطول وأكثر كلفة، وتريد كذلك منع المصنع من بيع الأثاث المصنوع لها إلى غيرها حتى يُفصل في النزاع."],"docs":"العقد، والمراسلات بشأن التأخير.","q":["هل يجوز للشركة رفع الدعوى أمام المحكمة رغم شرط التحكيم؟ وماذا يحدث لو رفعتها ودفع المصنع بوجود الشرط؟","كيف تحصل الشركة على إجراء وقتي عاجل يمنع بيع الأثاث إلى الغير؟"]},{"t":"إصابة عمل لعامل غير مسجل في التأمينات","who":"محمد (…)، فني صيانة","facts":["يعمل محمد منذ 1447/7هـ لدى مؤسسة صغيرة للصيانة براتب أربعة آلاف وخمسمئة ريال، ولم تسجله المؤسسة في التأمينات الاجتماعية، ولا يوجد عقد مكتوب.","وفي 1448/5/12هـ سقط من سلم أثناء صيانة مكيف في منزل أحد عملاء المؤسسة، فكُسرت يده، وأُجريت له عملية دفع تكلفتها من ماله، وقدرها أحد عشر ألف ريال. ويقول صاحب المؤسسة: «أنت لست مسجلاً عندي، ولا أتحمل شيئاً»."],"docs":"تقرير المستشفى وفاتورة العملية، وكشف الحساب البنكي بتحويلات الراتب، ورسائل «واتساب» بتكليفه بمهمة الصيانة يوم الحادث.","q":["كيف يثبت محمد علاقة العمل؟","ما حقوقه بسبب الإصابة، ومن يتحملها؟ وما أثر عدم تسجيله في التأمينات؟","ما الجهات التي يلجأ إليها، وبأي ترتيب؟"]},{"t":"إنهاء إيجار سكني قبل مدته","who":"فيصل (…)، مستأجر","facts":["استأجر فيصل شقة بعقد موثق في منصة «إيجار» مدته سنة تبدأ من 1448/1/1هـ، بأجرة ثلاثين ألف ريال على قسطين، ودفع القسط الأول. ونص العقد على أنه: «لا يحق للمستأجر إنهاء العقد قبل انتهاء مدته، وإن فعل التزم بأجرة المدة الباقية كاملة».","نقلت جهة عمل فيصل مقر عمله إلى مدينة أخرى اعتباراً من 1448/7/1هـ، فأبلغ المؤجر برغبته في الخروج، فطالبه المؤجر بالقسط الثاني كاملاً."],"docs":"عقد الإيجار، وخطاب النقل من جهة العمل.","q":["هل يلزم فيصل دفع القسط الثاني كاملاً؟","هل يُعد نقل العمل عذراً يبيح له إنهاء العقد؟","ما الحلول الودية والنظامية المتاحة له، وما أقلها كلفة؟"]},{"t":"سور الجار داخل الأرض","who":"ناصر (…)، مالك أرض","facts":["بنى جار ناصر سوراً بين أرضيهما في 1447/8هـ. وفي 1448/5هـ رفع ناصر أرضه بمكتب مساحة معتمد، فتبيّن أن السور يدخل في أرضه بعرض ستين سنتيمتراً، وطول خمسة وعشرين متراً.","طلب ناصر من جاره إزالة التعدي، فرد الجار بأن السور قائم منذ أكثر من سنة وناصر ساكت عنه، فلا حق له الآن."],"docs":"صك الأرض، وتقرير الرفع المساحي، وصورة من المخطط المعتمد.","q":["هل سقط حق ناصر بسكوته أكثر من سنة؟","ما الطريق النظامي لاسترداد الجزء المتعدى عليه، وأمام أي محكمة؟","ما الأدلة التي يحتاجها؟ وهل يكفي تقرير مكتب المساحة؟"]},{"t":"طي قيد طالب انقطع لمرافقة والده","who":"تركي (…)، طالب جامعي","facts":["انقطع تركي عن الدراسة الفصل الثاني من العام الجامعي 1447هـ كاملاً؛ لأنه رافق والده في علاجه بمدينة أخرى، ولم يتقدم إلى الجامعة بطلب اعتذار أو تأجيل.","وفي 1448/5/20هـ أبلغته الجامعة بطي قيده للانقطاع. ولديه تقارير طبية عن مرض والده، وخطاب من المستشفى يثبت مرافقته له."],"docs":"إشعار طي القيد، والتقارير الطبية، وخطاب المرافقة.","q":["هل يمكن تركي الاعتراض على قرار طي القيد؟ وأمام أي جهة، وفي أي مدة؟","إن رُفض اعتراضه، هل يستطيع اللجوء إلى القضاء؟ وأمام أي محكمة، وما شروط قبول دعواه؟","ما أثر عدم تقديمه طلب اعتذار في وقته؟"]},{"t":"الاعتراض على تقرير «نجم»","who":"سلطان (…)، سائق","facts":["وقع حادث تصادم بين سيارة سلطان وسيارة أخرى عند تقاطع في 1448/5/27هـ، فحمّل تقرير «نجم» سلطانَ خمسة وسبعين في المئة من الخطأ.","يقول سلطان إن السائق الآخر قطع الإشارة الحمراء، ولديه مقطع من كاميرا سيارته يثبت ذلك، لكنه لم يعرضه على مندوب «نجم» وقت الحادث. وتطالبه شركة تأمين الطرف الآخر بثلاثة وعشرين ألف ريال قيمة إصلاح السيارة."],"docs":"تقرير «نجم»، ومقطع الكاميرا، ووثيقة تأمينه.","q":["هل يمكن الاعتراض على تقرير «نجم»؟ وكيف، وفي أي مدة؟","ما قيمة مقطع الكاميرا في الإثبات؟","ما الذي يفعله إن رُفض اعتراضه؟"]},{"t":"مدرسة أهلية تحجز ملف طالب","who":"والد الطالب يوسف (…)","facts":["نقل الأب ابنه في بداية العام الدراسي 1448هـ من مدرسة أهلية إلى مدرسة حكومية، وكان على الطالب رسوم متأخرة للعام السابق قدرها ستة آلاف ريال.","رفضت المدرسة الأهلية تسليم ملف الطالب وشهادته حتى تُسدد الرسوم، فتعطل تسجيله في المدرسة الحكومية أسبوعين."],"docs":"عقد التسجيل في المدرسة الأهلية، وفواتير الرسوم، ورسالة المدرسة برفض تسليم الملف.","q":["هل يحق للمدرسة حجز ملف الطالب وشهادته حتى السداد؟","ما الجهة المختصة بالشكوى؟","كيف تحفظ المدرسة حقها في الرسوم دون الإضرار بالطالب؟ وما الذي توصي به الأب؟"]},{"t":"حسم من الراتب دون تحقيق","who":"عادل (…)، موظف مبيعات","facts":["حسمت الشركة من راتب عادل لشهر جمادى الأولى 1448هـ أجر خمسة أيام «جزاءً» لتأخره عن الدوام ثلاث مرات في الشهر، دون أن تبلغه كتابياً، ودون أن تسمع أقواله.","يقول عادل إنه لم يطلع قط على لائحة تنظيم العمل في الشركة، وإنها غير منشورة للموظفين، وإن تأخره كان بسبب إغلاق طريق لأعمال صيانة."],"docs":"مسير الراتب، وسجل الحضور والانصراف.","q":["هل يجوز للشركة توقيع هذا الجزاء بهذه الطريقة؟","ما الشروط النظامية لتوقيع الجزاء على العامل؟ وهل الحسم متناسب مع المخالفة؟","كيف يسترد عادل المبلغ؟ وما المدة التي يجب أن يراعيها؟"]},{"t":"بيع حصة في أرض موروثة","who":"إبراهيم (…)، أحد الورثة","facts":["ورث إبراهيم مع إخوته الأربعة أرضاً بصك واحد، ولكل منهم الخمس. يريد إبراهيم بيع حصته، وإخوته يرفضون البيع لغيرهم، ويرفضون كذلك شراء حصته بسعر السوق.","وجد إبراهيم مشترياً من خارج الأسرة مستعداً لشراء حصته."],"docs":"صك الأرض، وصك حصر الورثة.","q":["هل يجوز لإبراهيم بيع حصته الشائعة دون موافقة إخوته؟","هل لإخوته حق في أخذ الحصة إن باعها لغيرهم؟ وبأي شروط؟","إن أراد إنهاء الشيوع كله، فما الطريق النظامي؟"]},{"t":"بصمة الوجه وكاميرات الموظفين","who":"شركة (ج) للخدمات اللوجستية (قبل التنفيذ)","facts":["تريد الشركة تركيب نظام حضور ببصمة الوجه لموظفيها المئة والعشرين، وكاميرات مراقبة في المكاتب وفي غرفة الاستراحة.","وتريد حفظ بيانات البصمة والتسجيلات سنة كاملة على خادم سحابي لدى مزود خارج المملكة، وتنوي إبلاغ الموظفين بالنظام الجديد برسالة بريد إلكتروني بعد تشغيله."],"docs":"عرض الشركة الموردة لنظام البصمة، ومخطط مواقع الكاميرات.","q":["ما الذي يلزم الشركة نظاماً قبل تشغيل النظام؟","هل في خطتها ما يخالف النظام؟ وما وجه المخالفة؟","ما التعديلات التي توصي بها؟"]},{"t":"محل بسجل تجاري دون رخصة بلدية","who":"مدير إدارة الرخص في بلدية محافظة (…)","facts":["ضبط مراقبو البلدية في 1448/6/3هـ محلاً لبيع العطور يعمل بسجل تجاري ساري، دون رخصة بلدية للمحل.","يريد مدير إدارة الرخص إصدار قرار بإغلاق المحل فوراً، وأحال الموضوع إلى الإدارة القانونية لإبداء الرأي قبل إصدار القرار."],"docs":"محضر الضبط، وصورة السجل التجاري.","q":["هل يجوز إغلاق المحل فوراً؟ أم يسبقه إجراء آخر؟","ما السند النظامي للمخالفة والجزاء؟","ما الإجراءات التي تحمي قرار البلدية من الإلغاء إن طُعن فيه أمام المحكمة الإدارية؟"]},{"t":"سحب مشروع من مقاول متأخر","who":"رئيس بلدية محافظة (…)","facts":["تعاقدت البلدية مع مقاول على رصف شوارع حي سكني مدة اثني عشر شهراً. وبعد مضي عشرة أشهر لم ينجز المقاول إلا ثلاثين في المئة من الأعمال.","وجهت إليه البلدية إنذارين كتابيين في 1448/4/1هـ و1448/5/1هـ، ولم يستجب. ويريد رئيس البلدية سحب العمل منه وتنفيذه على حسابه."],"docs":"العقد، وتقارير الإنجاز، والإنذاران.","q":["هل يجوز سحب العمل من المقاول في هذه الحالة؟","ما الإجراءات والشروط النظامية للسحب؟","ما حقوق البلدية تجاه المقاول بعد السحب؟ وما حقوقه هو؟"]},{"t":"خروج شريك من شركة ذات مسؤولية محدودة","who":"يوسف (…)، شريك يملك ثلاثين في المئة","facts":["أسس يوسف مع شريكين عام 1445هـ شركة ذات مسؤولية محدودة. ويريد الآن الخروج من الشركة وبيع حصته لشخص من خارجها عرض عليه سعراً جيداً.","يرفض الشريكان، ويقولان إن عقد التأسيس يمنع البيع لغير الشركاء. ويوسف لم يقرأ عقد التأسيس منذ توقيعه."],"docs":"عقد التأسيس، والسجل التجاري.","q":["هل يجوز ليوسف بيع حصته لغير الشركاء؟ وما حق الشريكين في ذلك؟","ما الذي يجب التحقق منه في عقد التأسيس أولاً؟","إن تعذر البيع، فما الخيارات الأخرى للخروج من الشركة؟"]},{"t":"قرض لصديق بتحويل بنكي دون عقد","who":"بدر (…)","facts":["حوّل بدر لصديقه في 1447/10/5هـ أربعين ألف ريال، وكتب في وصف التحويل: «سلفة»، ولم يكتبا عقداً. وأرسل إليه الصديق بعد أسبوع رسالة صوتية على «واتساب» يقول فيها: «أبشر، أرجعها لك بعد الصيف».","ولما طالبه بدر في 1448/5هـ أنكر الصديق الدين، وقال إن المبلغ كان مساهمة من بدر في مشروع مشترك بينهما، وإن المشروع خسر."],"docs":"إشعار التحويل البنكي، والرسالة الصوتية.","q":["هل يستطيع بدر إثبات القرض؟ وما قيمة إشعار التحويل والرسالة الصوتية في الإثبات؟","على من يقع عبء إثبات أن المبلغ مساهمة في مشروع؟","ما الطريق النظامي لاسترداد المبلغ، وأمام أي محكمة؟"]},{"t":"شيك بلا رصيد كافٍ","who":"مؤسسة (د) للمقاولات","facts":["تسلمت المؤسسة من أحد عملائها في 1448/5/10هـ شيكاً بخمسة وثمانين ألف ريال مقابل أعمال نفذتها له. ولما قدمته إلى البنك في 1448/5/20هـ رُدّ لعدم كفاية الرصيد، وأفاد البنك بأن في الحساب عشرين ألف ريال فقط."],"docs":"الشيك، وإفادة البنك بالرفض، وعقد الأعمال.","q":["ما الطرق النظامية المتاحة للمؤسسة لاقتضاء المبلغ؟ وأيها أسرع؟","هل تستطيع صرف المبلغ الموجود في الحساب جزئياً؟","هل للمسألة جانب جزائي؟ وما أثره على المطالبة بالمبلغ؟"]},{"t":"إنهاء إيجار تجاري بسبب الركود","who":"مؤسسة (هـ) للملابس","facts":["استأجرت المؤسسة محلاً تجارياً بعقد مدته ثلاث سنوات تبدأ من 1447/1/1هـ، بأجرة سنوية قدرها مئة وعشرون ألف ريال. ونص العقد على أنه: «إذا أنهى المستأجر العقد قبل مدته التزم بدفع أجرة سنة كاملة تعويضاً للمؤجر».","افتُتح مجمع تجاري كبير قرب المحل في 1447/10هـ، فانخفضت مبيعات المؤسسة ستين في المئة، وتريد إنهاء العقد في 1448/8/1هـ."],"docs":"عقد الإيجار، وتقارير المبيعات.","q":["هل يُعد افتتاح المجمع التجاري ظرفاً يبيح للمؤسسة فسخ العقد أو طلب تخفيض الأجرة؟","هل التعويض المتفق عليه (أجرة سنة) ملزم كله؟ وهل للمحكمة أن تخفضه؟","ما الخيار الأقل كلفة للمؤسسة؟"]},{"t":"موظف حكومي يريد متجراً إلكترونياً","who":"سامي (…)، موظف في جهة حكومية","facts":["يريد سامي فتح متجر إلكتروني لبيع القهوة المختصة باسمه، والعمل فيه بعد انتهاء دوامه الرسمي.","ويريد كذلك تقديم استشارات محاسبية بمقابل عبر إحدى منصات العمل الحر، في مجال تخصصه."],"docs":"لا توجد مستندات؛ يسأل قبل أن يبدأ.","q":["هل يجوز لسامي ممارسة هذين النشاطين نظاماً؟","ما القيود والإجراءات التي يلزمه مراعاتها؟","ما المسؤولية التي قد يتعرض لها إن مارسهما دون إذن؟"]},{"t":"صانع محتوى ينشر إعلانات دون ترخيص","who":"هتان (…)، صانع محتوى","facts":["لدى هتان ثلاثمئة ألف متابع في «سناب شات»، ويتقاضى مبالغ من متاجر محلية مقابل الإعلان عن منتجاتها في حسابه، دون أن يحصل على ترخيص «موثوق».","وصلته رسالة نصية تقول إنها من الهيئة العامة لتنظيم الإعلام، تطلب منه تصحيح وضعه خلال أسبوع، وفيها رابط لسداد «غرامة»."],"docs":"الرسالة النصية، وصور بعض الإعلانات.","q":["ما الحكم النظامي لنشاطه الحالي؟ وما الذي يلزمه لتصحيح وضعه؟","ما مسؤوليته المحتملة عن الإعلانات السابقة؟","كيف يتحقق من أن الرسالة رسمية؟ وبماذا توصيه بشأن الرابط؟"]},{"t":"ابتزاز إلكتروني","who":"شاب في العشرين (طلب عدم ذكر اسمه)","facts":["وصلت الشاب في 1448/6/9هـ رسائل من حساب مجهول على «إنستغرام»، يهدده صاحبها بنشر محادثات خاصة قديمة له إن لم يحوّل إليه خمسة آلاف ريال خلال يومين.","الشاب خائف، ويفكر في تحويل المبلغ حتى «ينتهي الموضوع»، أو في حذف حسابه ومحادثاته."],"docs":"صور الرسائل، واسم الحساب.","q":["ما التكييف النظامي لفعل صاحب الحساب؟ وما عقوبته؟","ماذا يفعل الشاب الآن، وما الذي يجب ألا يفعله؟","ما الجهة المختصة بالبلاغ، وكيف يقدمه؟"]},{"t":"مخالفة عدم إعلان الأسعار","who":"مؤسسة (و) للمواد الغذائية (بقالة)","facts":["حرر مراقب وزارة التجارة في 1448/5/25هـ مخالفة على المؤسسة بعنوان «عدم الإعلان عن الأسعار»، بغرامة مالية.","تقول المؤسسة إن الأسعار معلنة على الرفوف، لكن بعض البطاقات سقطت أثناء ترتيب البضاعة صباح يوم الجولة، وأعيدت بعد ساعة."],"docs":"إشعار المخالفة، وصور الرفوف بعد إعادة البطاقات، وتسجيل كاميرا المحل.","q":["هل يمكن الاعتراض على المخالفة؟ وأمام أي جهة، وفي أي مدة؟","ما الأدلة التي تقوي الاعتراض؟","بماذا توصي المؤسسة لتجنب تكرار المخالفة؟"]},{"t":"أرض بيعت لشخصين","who":"حمد (…)، مشترٍ","facts":["اشترى حمد أرضاً في 1448/5/20هـ بستمئة ألف ريال، ودفع الثمن كاملاً بموجب عقد مكتوب موقّع من الطرفين، على أن يتم الإفراغ بعد أسبوعين.","وقبل موعد الإفراغ اكتشف حمد أن البائع أفرغ الأرض لشخص آخر في 1448/5/28هـ مقابل ثمن أعلى."],"docs":"عقد البيع، وإشعار تحويل الثمن، وصورة الصك الجديد باسم المشتري الثاني.","q":["من مالك الأرض نظاماً؟","ما حقوق حمد تجاه البائع؟ وهل يستطيع الرجوع على المشتري الثاني؟ ومتى؟","هل للمسألة جانب جزائي؟"]},{"t":"مؤجر قطع الكهرباء عن مستأجر","who":"مازن (…)، مستأجر","facts":["انتهى عقد إيجار شقة مازن في 1448/5/30هـ ولم يُجدد، فطلب من المؤجر مهلة شهر للبحث عن سكن، فرفض المؤجر.","وفي 1448/6/3هـ قطع المؤجر الكهرباء عن الشقة، والعداد باسمه، وغيّر قفل البوابة الخارجية للعمارة، فأصبح مازن يدخل بإذن الحارس."],"docs":"عقد الإيجار، ورسائل المؤجر، وصور القفل الجديد.","q":["هل يحق للمؤجر ما فعله؟","ما الطريق النظامي الصحيح لإخلاء المستأجر بعد انتهاء العقد؟","ما حقوق مازن الآن؟ وما الذي يلزمه هو؟"]},{"t":"خريج قانون يريد الترافع عن الناس","who":"نواف (…)، خريج قانون حديث","facts":["تخرج نواف حديثاً، ولم يحصل على رخصة المحاماة بعد. عرض عليه ثلاثة من معارفه أن يوكلوه في دعاوى عمالية مقابل أتعاب.","وعرض عليه أحد مكاتب المحاماة أن يعمل فيه «مستشاراً قانونياً»، ويوقّع المذكرات القضائية باسمه."],"docs":"لا توجد مستندات؛ يسأل قبل أن يقبل.","q":["هل يجوز لنواف الترافع عن غيره؟ وفي أي حدود؟","هل يجوز له أخذ أتعاب على ذلك؟","ما حكم عمله في المكتب وتوقيعه المذكرات باسمه؟"]},{"t":"هدايا من شركة متقدمة لمنافسة","who":"رئيس لجنة فحص العروض في جهة حكومية","facts":["أرسلت شركة متقدمة لمنافسة قائمة إلى كل عضو في لجنة فحص العروض ساعة فاخرة، مع بطاقة تهنئة «بمناسبة مرور خمسة وعشرين عاماً على تأسيس الشركة»، قبل موعد فتح المظاريف بأسبوع.","قبل اثنان من الأعضاء الهدية، وأعادها الثالث، ويسأل رئيس اللجنة عن التصرف الصحيح."],"docs":"بطاقة التهنئة، وصورة الهدية.","q":["ما الحكم النظامي لقبول الأعضاء هذه الهدية؟","ما الذي يجب على رئيس اللجنة فعله الآن؟","ما أثر ذلك على عرض الشركة في المنافسة؟"]},{"t":"مصمم لم يقبض أجره","who":"رامي (…)، مصمم مستقل","facts":["اتفق رامي مع صاحب مقهى عبر «واتساب» على تصميم شعار وهوية بصرية للمقهى بسبعة آلاف ريال، دُفع منها ألفان. فسلّم الملفات النهائية في 1448/3/15هـ، واستعمل المقهى الشعار في لوحته وأكوابه وحساباته.","ثم رفض صاحب المقهى دفع الباقي؛ لأن التصميم «لم يعجبه»، مع أنه لم يطلب أي تعديل قبل استعماله."],"docs":"محادثة «واتساب»، وإشعار تحويل الدفعة الأولى، وصور استعمال الشعار.","q":["هل يستحق رامي باقي الأجر؟ وكيف يثبت الاتفاق؟","ما الطريق الأسرع لاقتضاء حقه؟","هل له أن يمنع المقهى من استعمال الشعار حتى يدفع؟"]}]}</script>

const RULES = "rules_version = '2';\n\n// Access rules for the LAW 483 homework platform.\n// - A student can read and write only the documents whose key he can derive from his university ID and national ID.\n// - Only the instructor's account can list the roster and all answers, change settings, and reopen a submission.\nservice cloud.firestore {\n  match /databases/{database}/documents {\n\n    function isAdmin() {\n      return request.auth != null && request.auth.uid == 'AH6b7doeGHYUd2HMf6HPGFb6BF92';\n    }\n\n    function okText(f, k) {\n      return !(k in f) || (f[k] is string && f[k].size() \u003c= 30000);\n    }\n\n    function validFields(f, t) {\n      return f is map\n        && f.keys().hasOnly(t == 'com' ? ['f1', 'f2', 'f3', 'f4', 'f5', 'f6', 'f7'] : ['f1', 'f2', 'f3', 'f4'])\n        && okText(f, 'f1') && okText(f, 'f2') && okText(f, 'f3') && okText(f, 'f4')\n        && okText(f, 'f5') && okText(f, 'f6') && okText(f, 'f7');\n    }\n\n    function studentCanWrite(sid) {\n      let key = sid.split('_')[0];\n      let t = sid.split('_')[1];\n      let r = get(/databases/$(database)/documents/roster/$(key)).data;\n      let s = get(/databases/$(database)/documents/settings/main).data[t];\n      let d = request.resource.data;\n      return sid.matches('^[0-9a-f]{64}_(com|con)$')\n        && s.open == true\n        && request.time \u003c s.deadline\n        && (resource == null || resource.data.status != 'submitted')\n        && d.keys().hasOnly(['uni', 'name', 'n', 'type', 'no', 'fields', 'status', 'updatedAt', 'submittedAt', 'paste', 'act', 'saves'])\n        && d.keys().hasAll(['uni', 'name', 'n', 'type', 'no', 'fields', 'status', 'updatedAt', 'submittedAt', 'paste', 'act', 'saves'])\n        && d.uni == r.uni && d.name == r.name && d.n == r.n && d.type == t\n        && d.no == (t == 'com' ? r.r : r.c)\n        && d.status in ['draft', 'submitted']\n        && d.updatedAt == request.time\n        && ((d.status == 'submitted' && d.submittedAt == request.time) || (d.status == 'draft' && d.submittedAt == null))\n        && d.saves is int && d.saves == (resource == null ? 1 : resource.data.saves + 1)\n        && d.act is int && d.act >= 0\n        && d.paste is map && d.paste.keys().hasOnly(['count', 'chars'])\n        && d.paste.count is int && d.paste.chars is int\n        && validFields(d.fields, t);\n    }\n\n    match /settings/{id} {\n      allow get: if true;\n      allow list, write: if isAdmin();\n    }\n\n    match /roster/{key} {\n      allow get: if true;\n      allow list, write: if isAdmin();\n    }\n\n    match /subs/{sid} {\n      allow get: if true;\n      allow list, delete: if isAdmin();\n      allow create, update: if isAdmin() || studentCanWrite(sid);\n    }\n  }\n}\n";

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (["value", "checked", "disabled", "open", "hidden"].includes(k)) el[k] = v;

function studentRules(db, id, d, prev, now, deny) {
  const m = /^([0-9a-f]{64})_(com|con)$/.exec(id); if (!m) deny();
  const [, K, t] = m, r = db.roster[K], s = db.settings && db.settings[t];
  if (!r || !s || s.open !== true || !(now < s.deadline)) deny();
  if (prev && prev.status === "submitted") deny();
  const dk = Object.keys(d);
  if (dk.length !== SUB_KEYS.length || !SUB_KEYS.every(k => dk.includes(k))) deny();
  if (d.uni !== r.uni || d.name !== r.name || d.n !== r.n || d.type !== t || d.no !== (t === "com" ? r.r : r.c)) deny();
  if (!["draft", "submitted"].includes(d.status)) deny();
  if (!Number.isInteger(d.saves) || d.saves !== (prev ? prev.saves + 1 : 1)) deny();
  if (!Number.isInteger(d.act) || d.act < 0) deny();
  const p = d.paste;
  if (!p || typeof p !== "object" || Object.keys(p).some(k => k !== "count" && k !== "chars") || !Number.isInteger(p.count) || !Number.isInteger(p.chars)) deny();
  const allowed = A[t].fields.map(f => f.id), f = d.fields;
  if (!f || typeof f !== "object" || Object.keys(f).some(k => !allowed.includes(k)) || Object.values(f).some(v => typeof v !== "string" || v.length > 30000)) deny();
}

async function firebaseDB(cfg) {

    async getSettings() { const s = await fs.getDoc(R("settings", "main")); return s.exists() ? normSet(s.data()) : null; },
    async getSub(id) { const s = await fs.getDoc(R("subs", id)); return s.exists() ? normSub(s.data()) : null; },
    saveSub: (id, d, final) => fs.setDoc(R("subs", id), { ...d, status: final ? "submitted" : "draft", updatedAt: fs.serverTimestamp(), submittedAt: final ? fs.serverTimestamp() : null }),
    signIn: (email, pw) => au.signInWithEmailAndPassword(auth, email, pw),
    signOut: () => au.signOut(auth),
    onAuth: cb => au.onAuthStateChanged(auth, u => cb(u ? { email: u.email, uid: u.uid } : null)),
    async listRoster() { const q = await fs.getDocs(fs.collection(db, "roster")); return q.docs.map(x => ({ K: x.id, ...x.data() })); },
    async listSubs() { const q = await fs.getDocs(fs.collection(db, "subs")); return q.docs.map(x => ({ id: x.id, ...normSub(x.data()) })); },
    putRoster: (K, v) => fs.setDoc(R("roster", K), v),
    delRoster: K => fs.deleteDoc(R("roster", K)),
    putSettings: s => fs.setDoc(R("settings", "main"), {
      com: { open: !!s.com.open, deadline: fs.Timestamp.fromMillis(s.com.deadline) },
      con: { open: !!s.con.open, deadline: fs.Timestamp.fromMillis(s.con.deadline) },
      blockPaste: !!s.blockPaste,
    }),
    unlockSub: id => fs.updateDoc(R("subs", id), { status: "draft", submittedAt: null }),
    delSub: id => fs.deleteDoc(R("subs", id)),
    async moveSub(from, to, patch) {
      const s = await fs.getDoc(R("subs", from));

      await fs.setDoc(R("subs", to), { ...s.data(), ...patch });
      await fs.deleteDoc(R("subs", from));
      return true;
    },
  };
}

async function renderAssignment(t) {
  setWho("student");
  const def = A[t], no = noOf(session, t), src = srcOf(t, no), id = `${session.K}_${t}`;
  if (!src) { view.replaceChildren(errorPanel(`لم يُخصص لك ${def.unit} بعد. راجع أستاذ المقرر.`)); return; }

  try { [settings, server] = await Promise.all([T(DB.getSettings()), T(DB.getSub(id))]); }
  catch (e) { view.replaceChildren(errorPanel(errText(e), route)); return; }
  if (location.hash !== `#/a/${t}`) return;

  const cfg = (settings && settings[t]) || null;
  const blockPaste = !!(settings && settings.blockPaste);
  const st = {
    fields: Object.fromEntries(def.fields.map(f => [f.id, ""])), paste: { count: 0, chars: 0 }, act: 0, rev: 0,
    status: "new", submittedAt: null, updatedAt: null, dirty: false, saving: false, again: false, err: null, lastInput: 0, firstDirty: 0,
  };
  if (server) {
    for (const f of def.fields) st.fields[f.id] = (server.fields && server.fields[f.id]) || "";
    st.paste = { count: (server.paste && server.paste.count) || 0, chars: (server.paste && server.paste.chars) || 0 };
    st.act = server.act || 0; st.rev = server.saves || 0; st.status = server.status || "draft";
    st.submittedAt = server.submittedAt; st.updatedAt = server.updatedAt;

  let notice = null;
  const local = readLS(LSK(id));
