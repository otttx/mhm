<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B4F96">
<title>منصة واجبات مهارات المهن القانونية (483 نظم)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap">
<style>
:root{
  --ink:#16293B; --ink2:#4B5E70; --muted:#687A8B;
  --blue:#0B4F96; --blue-d:#083B71; --teal:#0F8C99;
  --desk:#E9EEF3; --paper:#fff; --rule:#CCD6E0; --tint:#F3F6FA;
  --seal:#9A2B23; --seal-bg:#FBF0EE; --stamp:#2B3E9E;
  --ok:#1D7A4C; --ok-bg:#E8F4EE; --wip:#8A5D00; --wip-bg:#FBF3DF;
  --sans:"Almarai","Segoe UI",Tahoma,"DejaVu Sans",sans-serif;
  --naskh:"Noto Naskh Arabic","Traditional Arabic","Times New Roman","DejaVu Serif",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 16px/1.75 var(--sans);min-height:100vh;display:flex;flex-direction:column}
main{flex:1;outline:none}
a{color:var(--blue)}
h1,h2,h3,h4{line-height:1.45;margin:0}
p{margin:0 0 .6rem}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

.banner{background:var(--wip-bg);color:#5C4300;border-bottom:1px solid #E6D29A;padding:.45rem 1rem;font-size:14px;text-align:center}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.75rem;min-height:56px;padding:.4rem 1rem;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none;color:var(--ink);min-width:0}
.brand img{height:34px;width:auto;flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.4;border-inline-start:1px solid var(--rule);padding-inline-start:.7rem;min-width:0}
.brand-t b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-t small{font-size:12px;color:var(--ink2)}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:.6rem;font-size:14px;color:var(--ink2);min-width:0}
.who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
@media (max-width:600px){.brand-t{display:none}.brand img{height:30px}.who .nm{max-width:46vw}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:44px;padding:.55rem 1.1rem;border:1px solid var(--blue);border-radius:6px;background:var(--paper);color:var(--blue);font:700 15px/1.2 var(--sans);text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:36px;padding:.3rem .8rem;font-size:14px}
.btn.danger{border-color:var(--seal);color:var(--seal)}
.btn.danger.primary{background:var(--seal);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wide{width:100%}
.inp{width:100%;min-height:48px;padding:.55rem .8rem;border:1px solid #AEBBC8;border-radius:6px;background:#fff;color:var(--ink);font:400 17px/1.5 var(--sans)}
.inp[dir=ltr]{text-align:left}
.masked{-webkit-text-security:disc}
.lbl{display:block;font-weight:700;font-size:15px;margin:1rem 0 .35rem}
.form-err{color:var(--seal);font-size:14px;min-height:1.4em;margin:.7rem 0 .2rem}
.muted{color:var(--muted)} .small{font-size:13.5px}
.chk{display:flex;align-items:center;gap:.55rem;font-weight:700;margin:.3rem 0}
.chk input{width:20px;height:20px;flex:none}

/* login: a case-file cover */
.login-wrap{padding:9vh 1rem 2.5rem}
.cover{max-width:440px;margin:0 auto;position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:2px 2px 10px 10px;padding:2rem 1.5rem 1.4rem;box-shadow:0 3px 0 -1px var(--paper),0 3px 0 0 var(--rule),0 6px 0 -1px var(--paper),0 6px 0 0 var(--rule)}
.cover-tab{position:absolute;top:-30px;inset-inline-start:20px;height:30px;padding:.3rem 1rem 0;background:var(--blue);color:#fff;font-size:13px;font-weight:700;border-radius:8px 8px 0 0}
.cover .logo{display:block;height:44px;margin:0 auto 1rem}
.cover h1{font-size:21px;font-weight:800;text-align:center}
.cover .sub{color:var(--ink2);font-size:14px;text-align:center;margin-bottom:.4rem}
.pw{display:flex;gap:.4rem;align-items:center}
.privacy{font-size:13px;color:var(--muted);margin:.9rem 0 0;text-align:center}
.demo-hint{max-width:440px;margin:2.2rem auto 0;font-size:14px}

/* dashboard */
.dash{max-width:860px;width:100%;margin:0 auto;padding:1.6rem 1rem 3rem}
.hello{font-size:24px;font-weight:800}
.dash>.sub{color:var(--ink2);margin:.15rem 0 0;font-size:14px}
.files{display:grid;gap:2.6rem 1.25rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));margin-top:3rem}
.file{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:0 0 10px 10px;padding:1.3rem 1.25rem 1.25rem;display:flex;flex-direction:column}
.file-tab{position:absolute;top:-31px;inset-inline-start:-1px;height:31px;padding:.3rem 1rem 0;background:var(--paper);border:1px solid var(--rule);border-bottom:0;border-radius:9px 9px 0 0;font-size:13px;font-weight:700;color:var(--blue)}
.file h2{font-size:19px;font-weight:800}
.file .ref{font-family:var(--naskh);font-size:17px;line-height:1.8;margin:.35rem 0 1rem}
.file dl{margin:0 0 1.1rem;display:grid;gap:.55rem}
.file dt{font-size:12.5px;color:var(--muted)}
.file dd{margin:0;font-size:14.5px}
.file .btn{margin-top:auto}
.howto{margin-top:2.4rem;padding:1rem 1.2rem;border-inline-start:3px solid var(--teal);background:var(--paper)}
.howto h2{font-size:16px;font-weight:800}
.howto ul{margin:.4rem 0 0;padding-inline-start:1.2rem;font-size:15px}
.chip{display:inline-block;padding:0 .6rem;border-radius:999px;font-size:13px;font-weight:700;border:1px solid currentColor;line-height:1.75;white-space:nowrap}
.chip.new{color:var(--muted)}
.chip.draft{color:var(--wip);background:var(--wip-bg)}
.chip.done{color:var(--ok);background:var(--ok-bg)}
.chip.late{color:var(--seal);background:var(--seal-bg)}

/* workspace */
.ws-head{max-width:1400px;width:100%;margin:0 auto;padding:1rem 1rem .2rem;display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .9rem}
.ws-head h1{font-size:19px;font-weight:800;flex:1 1 260px}
.seg{position:sticky;top:56px;z-index:20;display:flex;padding:.5rem 1rem;background:var(--desk)}
.seg button{flex:1;min-height:42px;border:1px solid var(--blue);background:var(--paper);color:var(--blue);font:700 15px var(--sans);cursor:pointer}
.seg button:first-child{border-radius:0 6px 6px 0}
.seg button:last-child{border-radius:6px 0 0 6px;border-inline-start:0}
.seg button[aria-selected=true]{background:var(--blue);color:#fff}
.ws{max-width:1400px;width:100%;margin:0 auto;padding:.4rem 1rem 1.5rem;display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr)}
@media (max-width:1099px){.ws[data-pane=doc] .ans-col{display:none}.ws[data-pane=ans] .doc-col{display:none}}
@media (min-width:1100px){
  .seg{display:none}
  .ws{grid-template-columns:minmax(0,1fr) minmax(0,1.08fr)}
  .doc-col{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 150px);overflow:auto;overscroll-behavior:contain}
}

/* the case document */
.doc{background:var(--paper);border:1px solid var(--rule);padding:1.4rem 1.3rem 1.5rem;font:400 18px/2 var(--naskh)}
.doc p{margin:0 0 .7rem}
.doc .doc-label{font:700 13px/1.5 var(--sans);color:var(--teal);margin-bottom:.7rem}
.doc-head{text-align:center;padding-bottom:.8rem;margin-bottom:.7rem;border-bottom:3px double #8797A6}
.doc-head .court{font-weight:700;font-size:20px;line-height:1.7;margin:0}
.doc-head .circuit{font-weight:600;margin:0}
.doc-head .meta{font-size:15.5px;line-height:1.85;color:var(--ink2);margin:0}
.doc .fict{font:400 13px/1.6 var(--sans);color:var(--muted);text-align:center;margin-bottom:.4rem}
.doc h4{font:800 15px/1.5 var(--sans);color:var(--blue);margin:1.3rem 0 .4rem}
.doc blockquote{margin:.1rem 0 .8rem;padding:.55rem .9rem;background:var(--tint);border-inline-start:3px solid #9FB0C1;font-size:17px}
.doc .dissent{border-inline-start:3px solid #B9A57A;padding-inline-start:.85rem}
.doc .final{margin-top:1.2rem;padding:.1rem 1rem .5rem;border:1.5px solid var(--ink2)}
.doc .final h4{margin-top:.7rem}
.doc ol{margin:0 0 .4rem;padding-inline-start:1.4rem}
.doc li{margin-bottom:.45rem}

/* instructions */
.ins{background:var(--paper);border:1px solid var(--rule);margin-bottom:1rem}
.ins>summary{cursor:pointer;padding:.8rem 1.1rem;font-weight:800;font-size:16px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem}
.ins>summary::-webkit-details-marker{display:none}
.ins>summary::after{content:"+";font-size:24px;line-height:1;color:var(--blue)}
.ins[open]>summary::after{content:"−"}
.ins-body{padding:0 1.1rem 1.1rem;font-size:15.5px}
.ins-body h3{font-size:15.5px;font-weight:800;margin:1rem 0 .3rem;color:var(--blue)}
.ins-body ul{margin:0;padding-inline-start:1.2rem}
.ins-body li{margin-bottom:.3rem}
.ai{margin-top:1.1rem;padding:.75rem 1rem .8rem;background:var(--seal-bg);border-inline-start:4px solid var(--seal)}
.ins-body .ai h3{color:var(--seal);margin-top:0}
.rubric{width:100%;border-collapse:collapse;font-size:15px;margin-top:.2rem}
.rubric td{padding:.35rem .4rem;border-bottom:1px solid var(--rule)}
.rubric td:last-child{text-align:left;font-weight:800;width:4.5rem;color:var(--blue)}
.clo{font-size:13px;color:var(--muted);margin:.9rem 0 0}

/* answer fields */
.note{padding:.75rem 1rem;margin-bottom:1rem;border:1px solid var(--rule);border-inline-start:4px solid var(--teal);background:var(--paper);font-size:15px}
.note.warn{border-inline-start-color:var(--wip);background:var(--wip-bg)}
.note.bad{border-inline-start-color:var(--seal);background:var(--seal-bg)}
.note p:last-child{margin:0}
.field{background:var(--paper);border:1px solid var(--rule);padding:1rem 1.1rem .8rem;margin-bottom:1rem}
.field>label,.field>h3{display:flex;align-items:center;gap:.65rem;font-weight:800;font-size:17px}
.num{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);font:800 14px/1 var(--sans)}
.hint{font-size:14.5px;color:var(--ink2);margin:.45rem 0 .7rem;line-height:1.75}
.field textarea{display:block;width:100%;min-height:170px;resize:vertical;padding:.7rem .9rem;border:1px solid #AEBBC8;border-radius:6px;background:#fff;color:var(--ink);font:400 17.5px/1.95 var(--naskh)}
.field textarea:focus{border-color:var(--teal)}
.field-meta{display:flex;justify-content:space-between;gap:1rem;font-size:13px;color:var(--muted);margin-top:.4rem}
.wc.low{color:var(--wip)}
.answer{white-space:pre-wrap;font:400 17.5px/1.95 var(--naskh);margin:.6rem 0 .3rem;overflow-wrap:anywhere}
.answer.empty{color:var(--muted);font-family:var(--sans);font-size:15px}
.savebar{position:sticky;bottom:0;z-index:25;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem;padding:.55rem 1rem calc(.55rem + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--rule)}
.save-status{flex:1 1 230px;font-size:13.5px;color:var(--ink2);display:flex;align-items:center;gap:.45rem;line-height:1.5}
.save-status::before{content:"";width:9px;height:9px;border-radius:50%;background:#AEBBC8;flex:none}
.save-status.ok::before{background:var(--ok)}
.save-status.local::before{background:var(--wip)}
.save-status.busy::before{background:var(--teal)}
.save-status.err{color:var(--seal)}
.save-status.err::before{background:var(--seal)}
.total{font-size:13.5px;color:var(--muted)}

/* the submission stamp */
.stamp-wrap{display:flex;align-items:center;gap:1.3rem;background:var(--paper);border:1px solid var(--rule);padding:1rem 1.2rem;margin-bottom:1rem}
.stamp{flex:none;width:116px;height:116px;border-radius:50%;border:3px solid var(--stamp);box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 5.5px var(--stamp);color:var(--stamp);display:grid;place-content:center;text-align:center;transform:rotate(-11deg);opacity:.9}
.stamp b{font:800 18px/1.3 var(--sans)}
.stamp small{font:700 11.5px/1.45 var(--sans)}
.stamp.anim{animation:thump .42s cubic-bezier(.2,.8,.25,1.15) both}
@keyframes thump{0%{transform:scale(1.9) rotate(-11deg);opacity:0}65%{transform:scale(.95) rotate(-11deg);opacity:1}100%{transform:scale(1) rotate(-11deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.stamp.anim{animation:none}}

/* dialogs, toast, loading */
dialog{border:0;padding:0;border-radius:10px;max-width:min(560px,94vw);width:100%;color:var(--ink);box-shadow:0 18px 50px rgba(10,30,50,.28)}
dialog::backdrop{background:rgba(14,30,48,.5)}
.dlg{padding:1.3rem 1.3rem 1.1rem;font-size:15.5px}
.dlg h2{font-size:19px;font-weight:800;margin-bottom:.6rem}
.actions{display:flex;gap:.6rem;margin-top:1.1rem;flex-wrap:wrap}
.wc-list{margin:.6rem 0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.wc-list li{display:flex;justify-content:space-between;gap:1rem;padding:.35rem 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.wc-list li.short{color:var(--seal)}
.pledge{display:flex;gap:.6rem;align-items:flex-start;margin-top:1rem;padding:.7rem .8rem;background:var(--tint);font-size:14.5px;cursor:pointer}
.pledge input{width:20px;height:20px;margin-top:.25rem;flex:none}
#toast{position:fixed;left:0;right:0;bottom:86px;margin:0 auto;width:max-content;max-width:92vw;padding:.65rem 1rem;border-radius:8px;background:var(--ink);color:#fff;font-size:14.5px;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:60}
#toast.show{opacity:1;transform:none}
#toast.warn{background:var(--seal)}
.center{max-width:600px;width:100%;margin:10vh auto;padding:0 1rem;text-align:center;color:var(--ink2)}
.center h1{font-size:20px;color:var(--ink);margin-bottom:.6rem}
.spin{width:28px;height:28px;border:3px solid var(--rule);border-top-color:var(--blue);border-radius:50%;margin:0 auto .8rem;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* instructor */
.adm{max-width:1200px;width:100%;margin:0 auto;padding:1.2rem 1rem 3rem}
.adm-title{font-size:22px;font-weight:800}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--rule);margin:.6rem 0 1.2rem;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:.7rem 1rem;font:700 15px var(--sans);color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--blue);border-bottom-color:var(--blue)}
.sumrow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.6rem;margin-bottom:1rem;font-size:14.5px}
.sumrow .btn{margin-inline-start:auto}
.tblwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--rule)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:680px}
.tbl th,.tbl td{padding:.5rem .65rem;border-bottom:1px solid var(--rule);text-align:start;vertical-align:top}
.tbl th{background:var(--tint);font-weight:800;font-size:13.5px}
.tbl td.n{width:2.6rem;color:var(--muted)}
.tbl td small{display:block;color:var(--muted);font-size:12.5px}
.cellbtn{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:.2rem .3rem;border-radius:4px}
.cellbtn:hover{background:var(--tint)}
.cellbtn:focus-visible{outline:3px solid var(--teal)}
.cellbtn small{display:block;color:var(--muted);font-size:12.5px;margin-top:.15rem}
.flag{color:var(--seal);font-weight:700;font-size:12.5px}
.panel{background:var(--paper);border:1px solid var(--rule);padding:1.1rem 1.2rem;margin:0 0 1rem}
.panel h2{font-size:17px;font-weight:800;margin-bottom:.6rem}
fieldset.panel{min-width:0}
fieldset.panel legend{font-weight:800;padding:0 .4rem;font-size:16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:.7rem 1rem;font-size:14px;margin:.4rem 0 .2rem}
.kv span{display:block;color:var(--muted);font-size:12.5px}
.vw{display:grid;gap:1.2rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:1100px){.vw{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.vw .doc{position:sticky;top:72px;max-height:calc(100vh - 100px);overflow:auto}}
code.uid{direction:ltr;display:inline-block;padding:.25rem .55rem;background:var(--tint);border:1px solid var(--rule);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;user-select:all;word-break:break-all}
textarea.code,pre.code{font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:left}
pre.code{background:var(--tint);border:1px solid var(--rule);padding:.7rem;overflow:auto;white-space:pre-wrap}
.row-actions{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 0}
.progress{font-size:14px;color:var(--ink2);margin-top:.6rem}

@media print{
  body{background:#fff;display:block}
  .topbar,.banner,.tabs,.no-print,.savebar,.seg,#toast,.adm-title{display:none!important}
  .vw{display:block}
  .panel,.field{border:0;padding:0}
  .vw .doc{position:static;max-height:none;overflow:visible;break-before:page;border:0;padding:0}
}
</style>

<body>
