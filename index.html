  else if (local && local.dirty) {
    if ((local.rev || 0) >= st.rev) {
      for (const f of def.fields) if (typeof (local.fields || {})[f.id] === "string") st.fields[f.id] = local.fields[f.id];
      st.paste = { count: Math.max(st.paste.count, (local.paste && local.paste.count) || 0), chars: Math.max(st.paste.chars, (local.paste && local.paste.chars) || 0) };
      st.act = Math.max(st.act, local.act || 0); st.dirty = true; st.firstDirty = Date.now();
    } else {
      writeLS(BAK(id), local); dropLS(LSK(id));
      notice = "عُرضت النسخة الأحدث المحفوظة في المنصة من جهاز آخر.";
    }
  }
  const lockOf = () => {
    if (st.status === "submitted") return "submitted";
    if (!cfg) return "closed";
    if (cfg.deadline && Date.now() >= cfg.deadline) return "ended";
    if (!cfg.open) return "closed";
    return null;
  };
  const lock = lockOf();
  const editable = !lock;
  const totalWords = () => def.fields.reduce((a, f) => a + countWords(st.fields[f.id]), 0);

  // ----- الأعمدة -----
  const docCol = h("div", { class: "doc-col" }, docFor(t, src, no));
  const ansCol = h("div", { class: "ans-col" });
  const ws = h("div", { class: "ws", "data-pane": totalWords() > 0 || lock === "submitted" ? "ans" : "doc" });
  const segBtns = [["doc", def.docTab], ["ans", lock === "submitted" ? "ما سلّمته" : "إجابتك"]].map(([k, label]) =>
    h("button", { type: "button", role: "tab", "aria-selected": String(ws.dataset.pane === k), "data-k": k, text: label }));
  const seg = h("div", { class: "seg", role: "tablist" }, segBtns);
  seg.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    ws.dataset.pane = b.dataset.k; segBtns.forEach(x => x.setAttribute("aria-selected", String(x === b)));
    if (b.dataset.k === "ans") requestAnimationFrame(growAll);

  });
  ws.append(docCol, ansCol);

  const insOpen = !readLS("law483:ins-seen:" + t) && lock !== "submitted";
  ansCol.append(instructions(def, blockPaste, insOpen));
  if (notice) ansCol.append(h("div", { class: "note warn" }, h("p", { text: notice })));
  const bak = lock === null ? readLS(BAK(id)) : null;
  if (bak && bak.fields) {
    const restore = h("button", { class: "btn small", text: "استرجاع نسختي على هذا الجهاز" });
    const box = h("div", { class: "note warn" }, h("p", { text: "لديك على هذا الجهاز نسخة أقدم لم تُرفع إلى المنصة. لك أن تسترجعها مكان النسخة الحالية." }), restore);
    restore.addEventListener("click", () => {
      for (const f of def.fields) if (typeof bak.fields[f.id] === "string") { st.fields[f.id] = bak.fields[f.id]; const ta = $(`#ta-${f.id}`); if (ta) { ta.value = st.fields[f.id]; grow(ta); } }
      dropLS(BAK(id)); box.remove(); touch(); updCounts(); toast("استُرجعت نسختك، وسترفع إلى المنصة.");
    });
    ansCol.append(box);
  }

  // ----- حالات الإغلاق -----
  if (lock === "submitted") {
    const stp = h("div", { class: "stamp" + (stampAnim === t ? " anim" : ""), "aria-hidden": "true" }, h("b", { text: "تم التسليم" }), h("small", { text: hij(st.submittedAt || Date.now()) }));
    stampAnim = null;
    ansCol.append(h("div", { class: "stamp-wrap" }, stp, h("div", null,
      h("p", { style: "font-weight:800;margin:0", text: `سلّمت ${def.work} تسليماً نهائياً.` }),
      h("p", { class: "muted small", style: "margin:0", text: `${when(st.submittedAt)} — ${totalWords()} كلمة. سيناقشك الأستاذ فيما كتبت.` }))));
  } else if (lock === "ended") {
    ansCol.append(h("div", { class: "note bad" }, h("p", { text: `انتهى موعد التسليم (${whenLong(cfg.deadline)})، ولم يُسلَّم هذا الواجب تسليماً نهائياً. راجع أستاذ المقرر إن كان لك عذر.` })));
  } else if (lock === "closed") {
    ansCol.append(h("div", { class: "note" }, h("p", { text: `التسليم غير مفتوح الآن. لك أن تقرأ ${def.unit} والتعليمات، وتُفتح خانات الكتابة حين يفتح الأستاذ التسليم.` })));
  }

  // ----- الخانات -----
  const wcEls = {};
  function grow(ta) { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 2, 170) + "px"; }
  function growAll() { ansCol.querySelectorAll("textarea").forEach(grow); }
  def.fields.forEach((f, i) => {

      const ta = h("textarea", { id: `ta-${f.id}`, rows: "6", dir: "rtl", spellcheck: "true", "aria-describedby": `hint-${f.id}` });
      ta.value = st.fields[f.id];
      ta.addEventListener("input", () => { st.fields[f.id] = ta.value; grow(ta); updCount(f); touch(); });
      ta.addEventListener("paste", onPaste);
      ta.addEventListener("drop", onDrop);
      wcEls[f.id] = h("span", { class: "wc" });
      ansCol.append(h("section", { class: "field" },
        h("label", { for: ta.id }, h("span", { class: "num", text: String(i + 1) }), f.label),
        h("p", { class: "hint", id: `hint-${f.id}`, text: f.hint }), ta,
        h("div", { class: "field-meta" }, wcEls[f.id], h("span", { text: `المقترح: ${f.range[0]}–${f.range[1]} كلمة` }))));
    } else if (lock !== "closed" || st.fields[f.id]) {
      const txt = (st.fields[f.id] || "").trim();
      ansCol.append(h("section", { class: "field" },
        h("h3", null, h("span", { class: "num", text: String(i + 1) }), f.label),
        h("div", { class: "answer" + (txt ? "" : " empty"), text: txt || "لم تُكتب هذه الخانة." }),
        h("div", { class: "field-meta" }, h("span", { text: `${countWords(txt)} كلمة` }))));
    }
  });

  // ----- شريط الحفظ -----
  const statusEl = h("span", { class: "save-status", "aria-live": "polite" });
  const totalEl = h("span", { class: "total" });
  const saveBtn = h("button", { class: "btn small", text: "حفظ" });
  const submitBtn = h("button", { class: "btn small primary", text: "تسليم نهائي" });
  const bar = editable ? h("div", { class: "savebar" }, statusEl, totalEl, saveBtn, submitBtn) : null;

  function updCount(f) {
    const w = countWords(st.fields[f.id]);
    wcEls[f.id].textContent = `${w} كلمة`;
    wcEls[f.id].classList.toggle("low", w > 0 && w < f.range[0]);
  }
  function updCounts() { def.fields.forEach(f => wcEls[f.id] && updCount(f)); renderStatus(); }
  function renderStatus() {
    if (!bar) return;
    let txt, cls = "";
    if (st.saving) { txt = "جارٍ الحفظ في المنصة…"; cls = "busy"; }
    else if (st.err) { txt = st.err; cls = "err"; }
    else if (st.dirty) { txt = "محفوظ على جهازك، وسيُرفع إلى المنصة خلال دقيقة"; cls = "local"; }
    else if (st.rev > 0) { txt = `محفوظ في المنصة${st.updatedAt ? " — " + when(st.updatedAt) : ""}`; cls = "ok"; }
    else txt = "لم تكتب شيئاً بعد";
    statusEl.textContent = txt; statusEl.className = "save-status " + cls;
    totalEl.textContent = `المجموع: ${totalWords()} كلمة`;
  }

  let lt = null;
  function flushLocal() {
    clearTimeout(lt);
    if (st.status === "submitted") return;
    if (st.dirty) writeLS(LSK(id), { fields: st.fields, paste: st.paste, act: Math.round(st.act), rev: st.rev, dirty: true, t: Date.now() });
    else dropLS(LSK(id));
  }
  function touch() {
    const now = Date.now();
    if (st.lastInput && now - st.lastInput < 120000) st.act += (now - st.lastInput) / 1000;
    st.lastInput = now;
    if (!st.dirty) st.firstDirty = now;
    st.dirty = true;
    clearTimeout(lt); lt = setTimeout(flushLocal, 600);
    renderStatus();
  }
  function onPaste(e) {
    if (blockPaste) { e.preventDefault(); toast(DATA.pasteBlocked, "warn"); return; }

    st.paste.count += 1; st.paste.chars += txt.length;
    if (!st.pasteNoted) { st.pasteNoted = true; toast("سُجّلت عملية اللصق، ويطّلع عليها الأستاذ."); }
  }
  function onDrop(e) {
    const txt = (e.dataTransfer && e.dataTransfer.getData("text")) || "";
    if (!txt) return;
    if (blockPaste) { e.preventDefault(); toast(DATA.pasteBlocked, "warn"); return; }
    st.paste.count += 1; st.paste.chars += txt.length;
  }

  async function explain(e) {
    if (!e || e.code !== "permission-denied") return errText(e) + " وعملك محفوظ على جهازك.";
    try {
      const [s2, srv] = await Promise.all([T(DB.getSettings()), T(DB.getSub(id))]);
      const c = s2 && s2[t];
      if (srv && srv.status === "submitted") return "سبق تسليم هذا الواجب تسليماً نهائياً، فلا يُقبل تعديله.";
      if (srv && (srv.saves || 0) > st.rev) return "حُفظت نسخة أحدث من جهاز آخر. حدّث الصفحة لتحميلها؛ وعملك هنا محفوظ على هذا الجهاز.";
      if (!c || !c.open) return "التسليم مغلق الآن، فلم يُرفع عملك إلى المنصة. وهو محفوظ على جهازك.";
      if (c.deadline && Date.now() >= c.deadline) return "انتهى موعد التسليم، فلم يُرفع عملك إلى المنصة.";
    } catch { /* fall through */ }
    return "رفضت المنصة الحفظ. راجع أستاذ المقرر، وعملك محفوظ على جهازك.";
  }
  async function sync(final = false) {
    if (st.saving) { if (!final) st.again = true; return false; }
    st.saving = true; st.err = null; renderStatus();
    const sent = JSON.stringify(st.fields);
    const payload = {
      uni: session.uni, name: session.name, n: session.n, type: t, no,
      fields: { ...st.fields }, paste: { count: st.paste.count, chars: st.paste.chars },
      act: Math.max(0, Math.round(st.act)), saves: st.rev + 1,
    };

    pendingSaves.set(id, new Promise(r => { release = r; }));
    try {
      await T(DB.saveSub(id, payload, final), 25000);
      ok = true;
      st.rev = payload.saves; st.updatedAt = Date.now(); st.status = final ? "submitted" : "draft";
      if (JSON.stringify(st.fields) === sent) st.dirty = false;
      if (final) { st.submittedAt = Date.now(); dropLS(LSK(id)); dropLS(BAK(id)); } else flushLocal();
    } catch (e) { st.err = await explain(e); flushLocal(); }
    finally {

  }

  function openSubmit() {
    const rows = def.fields.map((f, i) => ({ f, i, w: countWords(st.fields[f.id]) }));
    const short = rows.filter(r => r.w < def.req);
    const list = h("ol", { class: "wc-list" }, rows.map(r => h("li", { class: r.w < def.req ? "short" : "" }, h("span", { text: `${r.i + 1}. ${r.f.label}` }), h("b", { text: `${r.w} كلمة` }))));
    const back = h("button", { class: "btn", type: "button", text: "رجوع", onclick: closeDialog });
    if (short.length) {
      openDialog(h("div", { class: "dlg" }, h("h2", { text: "لا يمكن التسليم بعد" }),
        h("p", { text: `في الواجب خانات ناقصة. اكتب في كل خانة ${def.req} كلمة على الأقل، ثم سلّم:` }), list, h("div", { class: "actions" }, back)));
      return;
    }
    const pl = h("input", { type: "checkbox" });
    const go2 = h("button", { class: "btn primary", type: "button", text: "تسليم نهائي", disabled: true });
    const err = h("p", { class: "form-err", role: "alert" });
    pl.addEventListener("change", () => { go2.disabled = !pl.checked; });
    go2.addEventListener("click", async () => {
      go2.disabled = true; back.disabled = true; dlg.dataset.busy = "1"; go2.textContent = "جارٍ التسليم…"; err.textContent = "";
      while (st.saving) await sleep(150);

      if (ok) { closeDialog(); stampAnim = t; cleanup = null; route(); }
      else { err.textContent = st.err || "تعذر التسليم."; go2.disabled = !pl.checked; back.disabled = false; go2.textContent = "تسليم نهائي"; }
    });
    openDialog(h("div", { class: "dlg" }, h("h2", { text: "التسليم النهائي" }),
      h("p", { text: `بعد التسليم النهائي لا يمكنك تعديل ${def.work}. راجع عملك قبل أن تسلّم.` }), list,
      h("p", { class: "muted small", text: `المجموع: ${totalWords()} كلمة (المقترح: ${def.total[0]}–${def.total[1]}).` }),
      h("label", { class: "pledge" }, pl, h("span", { text: "أقرّ بأن هذا العمل من كتابتي، ولم أستعمل فيه أدوات الذكاء الاصطناعي، وأنا مستعد لمناقشته شفهياً." })),
      err, h("div", { class: "actions" }, go2, back)));
  }

  saveBtn.addEventListener("click", async () => {
    if (!st.dirty && st.rev > 0) { toast("لا تعديلات جديدة؛ عملك محفوظ في المنصة."); return; }
    if (await sync()) toast("حُفظ عملك في المنصة.");
  });
  submitBtn.addEventListener("click", openSubmit);

  // ----- العرض -----
  const back = h("a", { class: "btn small", href: "#/", text: "الواجبات" });
  const chip = statusInfo(st.status === "new" ? null : { status: st.status, submittedAt: st.submittedAt, updatedAt: st.updatedAt }, null).chip;
  view.replaceChildren(
    h("div", { class: "ws-head" }, h("h1", { text: `${def.title}: ${def.unit} رقم (${no})` }), chip, back),
    seg, ws, bar);
  updCounts();

  if (!editable) return;
  const tick = setInterval(() => {
    if (lockOf() && st.status !== "submitted") { clearInterval(tick); if (st.dirty) sync(); setTimeout(route, 1200); return; }
    if (!st.dirty || st.saving) return;
    const now = Date.now();
    if (now - st.lastInput > 15000 || now - st.firstDirty > 60000) sync();
  }, 5000);
  const onHide = () => { if (document.visibilityState === "hidden") { flushLocal(); if (st.dirty && !st.saving) sync(); } };
  document.addEventListener("visibilitychange", onHide);
  window.addEventListener("pagehide", flushLocal);

    clearInterval(tick); document.removeEventListener("visibilitychange", onHide); window.removeEventListener("pagehide", flushLocal);
    flushLocal();
    if (st.dirty && !lockOf()) { while (st.saving) await sleep(100); await sync(); }
  };
}

function validSaudiId(id) {
  if (!/^[12]\d{9}$/.test(id)) return false;
  let sum = 0;
  for (let i = 0; i < 10; i++) { const d = +id[i]; sum += i % 2 === 0 ? Math.floor(d * 2 / 10) + (d * 2) % 10 : d; }
  return sum % 10 === 0;
}
function parsePasted(text) {
  const rows = [];
  text.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach((line, i) => {
    const cells = (line.includes("\t") ? line.split("\t") : line.split(/[,;،]/)).map(c => toLatin(c).trim()).filter(Boolean);
    const nums = [], names = [];
    for (const c of cells) { if (/^\d+$/.test(c)) nums.push(c); else if (/[؀-ۿA-Za-z]/.test(c)) names.push(c); }
    if (!nums.length) return; // صف عناوين
    const nid = nums.find(x => x.length === 10 && /^[12]/.test(x));
    const uni = nums.find(x => x !== nid && x.length >= 6 && x.length <= 12);
    const small = nums.filter(x => x.length <= 3).map(Number);
    rows.push({ line: i + 1, name: names.join(" "), uni, nid, n: small[0], r: small[1], c: small[2] });
  });
  rows.forEach((x, i) => { if (!x.n) x.n = i + 1; if (!x.r) x.r = x.n; if (!x.c) x.c = x.n; });
  return rows;
}
function checkRows(rows) {
  const probs = [], seenU = new Set(), seenN = new Set();
  for (const x of rows) {
    const p = [];
    if (!x.name) p.push("الاسم ناقص");
    if (!x.uni) p.push("الرقم الجامعي ناقص");
    if (!x.K && !x.nid) p.push("رقم الهوية ناقص أو غير صحيح");
    else if (x.nid && !validSaudiId(x.nid)) p.push("تحقق من رقم الهوية (لا يجتاز اختبار الصحة)");
    if (!(x.r >= 1 && x.r <= DATA.rulings.length)) p.push("رقم الحكم خارج المدى");
    if (!(x.c >= 1 && x.c <= DATA.cases.length)) p.push("رقم الواقعة خارج المدى");
    if (x.uni && seenU.has(x.uni)) p.push("الرقم الجامعي مكرر");
    if (seenN.has(x.n)) p.push("رقم التسلسل مكرر");
    seenU.add(x.uni); seenN.add(x.n);
    x.problems = p;
    if (p.length) probs.push(x);
  }
  return probs;
}
async function importRows(AD, rows, progress) {
  const byUni = new Map(AD.roster.map(x => [x.uni, x]));
  let i = 0;
  for (const x of rows) {
    const K = x.K || await deriveKey(x.uni, x.nid);
    const old = byUni.get(x.uni);
    if (old && old.K !== K) {
      for (const t of TYPES) await T(DB.moveSub(`${old.K}_${t}`, `${K}_${t}`, { name: x.name, n: x.n, uni: x.uni }));
      await T(DB.delRoster(old.K));
    }
    await T(DB.putRoster(K, { name: x.name, uni: x.uni, n: x.n, r: x.r, c: x.c }));
    progress(++i, rows.length);
  }
}

  let pending = null;

  function showPreview(rows) {
    const probs = checkRows(rows);
    pending = probs.length ? null : rows;
    approve.hidden = !pending;
    const mask = x => (x.K ? "مفتاح جاهز" : x.nid ? `${x.nid[0]}•••••••${x.nid.slice(-2)}` : "—");
    preview.replaceChildren(
      h("p", { class: probs.length ? "form-err" : "muted small", text: probs.length ? `يوجد ${probs.length} صف فيه ملاحظات؛ صححها ثم أعد المعاينة.` : `${rows.length} طالباً جاهزون للاعتماد. راجع الجدول ثم اضغط «اعتماد الكشف».` }),
      h("div", { class: "tblwrap" }, h("table", { class: "tbl" },
        h("thead", null, h("tr", null, ["م", "الاسم", "الرقم الجامعي", "الهوية", "الحكم", "الواقعة", "ملاحظات"].map(x => h("th", { text: x })))),
        h("tbody", null, rows.map(x => h("tr", null, h("td", { class: "n", text: String(x.n) }), h("td", { text: x.name || "—" }), h("td", { text: x.uni || "—" }),
          h("td", { text: mask(x) }), h("td", { text: String(x.r) }), h("td", { text: String(x.c) }), h("td", { class: x.problems.length ? "flag" : "", text: x.problems.join("، ") || "—" })))))));
  }
  const file = h("input", { type: "file", accept: ".json,application/json", id: "rf" });
  file.addEventListener("change", async () => {
    const f = file.files && file.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (j.type !== "law483-roster" || !Array.isArray(j.rows)) throw new Error("bad");
      if (j.saltId !== await saltId()) { toast("هذا الملف لا يوافق نسخة المنصة الحالية.", "warn"); return; }
      const rows = j.rows.map(x => ({ K: /^[0-9a-f]{64}$/.test(x.K) ? x.K : null, name: String(x.name || "").trim(), uni: digits(x.uni), n: +x.n, r: +x.r, c: +x.c }));
      showPreview(rows);
    } catch { toast("تعذرت قراءة الملف. اختر ملف الكشف الجاهز (‎.json).", "warn"); }
  });
  const ta = h("textarea", { class: "inp", rows: "6", placeholder: "الصق هنا الصفوف من Excel: م، الاسم، الرقم الجامعي، رقم الهوية — ولك أن تضيف رقم الحكم ورقم الواقعة" });
  const prevBtn = h("button", { class: "btn", type: "button", text: "معاينة" });
  prevBtn.addEventListener("click", () => { const rows = parsePasted(ta.value); if (!rows.length) { toast("لم أجد صفوفاً فيها أرقام.", "warn"); return; } showPreview(rows); });
  approve.addEventListener("click", async () => {
    if (!pending) return;
    approve.disabled = true; prevBtn.disabled = true; file.disabled = true;
    try {
      await importRows(AD, pending, (i, n) => { status.textContent = `جارٍ الاعتماد: ${i} من ${n}`; });
      ta.value = ""; pending = null;
      toast("اعتُمد الكشف"); await ctx.reload("roster");
    } catch (e) { status.textContent = errText(e); approve.disabled = false; prevBtn.disabled = false; file.disabled = false; }
  });
  wrap.append(h("div", { class: "panel" }, h("h2", { text: "استيراد الكشف" }),
    h("p", { class: "small", text: "الطريقة الأولى: ارفع ملف الكشف الجاهز الذي فيه المفاتيح المشفّرة، فلا تحتاج إلى إدخال أي هوية." }),
    h("label", { class: "lbl", for: "rf", text: "ملف الكشف الجاهز" }), file,
    h("p", { class: "small", style: "margin-top:1.2rem", text: "الطريقة الثانية: الصق صفوف الطلاب من Excel (مفيدة لإضافة طالب جديد). تُحوَّل الهوية إلى مفتاح مشفّر في متصفحك، ولا تُرسل ولا تُحفظ." }),
    ta, h("div", { class: "row-actions" }, prevBtn), preview, h("div", { class: "row-actions" }, approve), status));
  return wrap;
}

function docText(t, src, no) {
  if (t === "com") {
    const L = [`الحكم المفترض رقم (${no}): ${src.t}`, src.court, ...src.meta, "", "الوقائع:", ...src.facts.map(f => (f.startsWith(">") ? "«" + f.slice(1) + "»" : f)), "", "الأسباب:", ...src.reasons];
    if (src.dissent) L.push("", "رأي المخالفة:", src.dissent);
    L.push("", "المنطوق:", src.ruling);
    return L.join("\n");
  }
  return [`طلب الاستشارة رقم (${no}): ${src.t}`, `مقدم الطلب: ${src.who}`, `تاريخ الطلب: ${DATA.caseDate}`, "", "الوقائع:", ...src.facts, "", "المستندات المتاحة: " + src.docs, "", "أسئلة صاحب الاستشارة:", ...src.q.map((q, i) => `${i + 1}- ${q}`)].join("\n");
}
function exportText(AD, { withDocs, onlySubmitted, types }) {
  const line = "════════════════════════════════════════";
  const L = [`${DATA.course.name} — ${DATA.course.section}`, `إجابات الطلاب في منصة الواجبات — صُدّرت ${whenLong(Date.now())}`];
  for (const t of types) { const d = AD.roster.filter(r => (AD.subs.get(`${r.K}_${t}`) || {}).status === "submitted").length; L.push(`${A[t].order} (${A[t].title}): سلّم ${d} من ${AD.roster.length}`); }
  L.push(line);
  for (const r of AD.roster) {
    const blocks = [];
    for (const t of types) {
      const s = AD.subs.get(`${r.K}_${t}`), def = A[t], no = noOf(r, t), src = srcOf(t, no);
      if (onlySubmitted && !(s && s.status === "submitted")) continue;
      const B = ["", `▌ ${def.order}: ${def.title} — ${def.unit} رقم (${no}): ${src ? src.t : ""}`];
      if (!s) B.push("الحالة: لم يبدأ.");
      else {
        B.push(`الحالة: ${s.status === "submitted" ? "سُلّم " + when(s.submittedAt) : "مسودة لم تُسلَّم — آخر حفظ " + when(s.updatedAt)}`);
        B.push(`الكلمات: ${subWords(t, s)} — مرات الحفظ: ${s.saves || 0} — اللصق: ${(s.paste && s.paste.count) || 0} مرة (${(s.paste && s.paste.chars) || 0} حرفاً، ${pastePct(t, s)}% من النص) — مدة الكتابة التقريبية: ${mins(s.act)}`);
      }
      if (withDocs && src) B.push("", t === "com" ? "[نص الحكم]" : "[الوقائع والأسئلة]", docText(t, src, no));
      if (s) B.push("", "[إجابة الطالب]", answerText(t, s));
      blocks.push(B.join("\n"));
    }
    if (blocks.length) L.push("", `الطالب (${r.n}): ${r.name} — الرقم الجامعي ${r.uni}`, ...blocks, "", line);
  }
  return L.join("\n");
}
function exportTab(AD) {
  const withDocs = h("input", { type: "checkbox", id: "x-docs", checked: true });
  const onlySub = h("input", { type: "checkbox", id: "x-sub" });
  const which = h("select", { class: "inp", id: "x-which" }, h("option", { value: "both", text: "الواجبان معاً" }), h("option", { value: "com", text: "التعليق على الحكم فقط" }), h("option", { value: "con", text: "الاستشارة فقط" }));
  const txtBtn = h("button", { class: "btn primary", text: "تنزيل ملف الإجابات للتقييم" });
  txtBtn.addEventListener("click", () => {
    const types = which.value === "both" ? TYPES : [which.value];
    download(`إجابات_طلاب_483_${stamp()}.txt`, exportText(AD, { withDocs: withDocs.checked, onlySubmitted: onlySub.checked, types }));
  });
  const jsonBtn = h("button", { class: "btn", text: "تنزيل نسخة احتياطية كاملة" });
  jsonBtn.addEventListener("click", () => download(`نسخة_احتياطية_منصة_483_${stamp()}.json`,
    JSON.stringify({ exportedAt: new Date().toISOString(), settings: AD.settings, roster: AD.roster, subs: [...AD.subs.values()] }, null, 2), "application/json"));
  return h("div", null,
    h("div", { class: "panel" }, h("h2", { text: "ملف الإجابات للتقييم" }),
      h("p", { class: "small", text: "ملف نصي فيه إجابات كل طالب مرتبة بخاناتها، مع حالة التسليم وعدد الكلمات وبيانات اللصق ومدة الكتابة. أرسله في المحادثة لنقيّم الإجابات معاً." }),
      h("label", { class: "lbl", for: "x-which", text: "الواجب" }), which,
      h("label", { class: "chk", for: "x-docs", style: "margin-top:.8rem" }, withDocs, "إرفاق نص الحكم أو الوقائع مع كل إجابة"),
      h("label", { class: "chk", for: "x-sub" }, onlySub, "المسلَّم تسليماً نهائياً فقط"),
      h("div", { class: "row-actions" }, txtBtn)),
    h("div", { class: "panel" }, h("h2", { text: "نسخة احتياطية" }),
      h("p", { class: "small", text: "ملف فيه كل بيانات المنصة: الإعدادات والكشف والإجابات. احتفظ به عندك ولا تنشره." }),
      h("div", { class: "row-actions" }, jsonBtn),
      DB.mode === "demo" ? h("div", { class: "row-actions" }, h("button", { class: "btn small danger", text: "مسح البيانات التجريبية", onclick: () => { DB.resetDemo(); sessionStorage.clear(); location.hash = ""; location.reload(); } })) : null));
}
const TABS = { track: trackTab, settings: settingsTab, roster: rosterTab, export: exportTab };

// ---------------- التشغيل ----------------
async function boot() {
  if (!CFG) $("#banner").replaceChildren(h("div", { class: "banner", text: "وضع تجريبي: المنصة غير مربوطة بقاعدة البيانات بعد، والبيانات تُحفظ في هذا المتصفح فقط." }));
  view.replaceChildren(loading("جارٍ التحميل…"));
  try { DB = CFG ? await firebaseDB(CFG) : mockDB(); await DB.init(); }
  catch (e) { view.replaceChildren(errorPanel(errText(e), () => location.reload())); return; }
  window.addEventListener("hashchange", route);
  route();
}
boot();
</script>
